<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 428" width="360" height="428" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-vehicle-recovery-setup" aria-label="Vehicle recovery strap setup">
