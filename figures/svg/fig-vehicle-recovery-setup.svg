<text x="214" y="124" font-size="10" text-anchor="middle" fill="#2e7d32">rated point</text>
<circle cx="36" cy="150" r="7" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="1.6"/><line x1="36" y1="157" x2="36" y2="166" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><line x1="26" y1="140" x2="46" y2="160" stroke="#c62828" stroke-width="2.6" stroke-linecap="round"/><line x1="26" y1="160" x2="46" y2="140" stroke="#c62828" stroke-width="2.6" stroke-linecap="round"/>
<text x="54" y="150.0" font-size="10.5" font-weight="bold" fill="#c62828">never the hitch ball,</text>
<text x="54" y="162.5" font-size="10.5" fill="#c62828">a bumper or a tie-down</text>
<text x="8" y="190" font-size="11.5" font-style="italic" fill="currentColor">From above</text>
