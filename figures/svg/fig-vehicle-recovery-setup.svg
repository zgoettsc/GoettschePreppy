<rect x="30" y="214" width="90" height="30" rx="4" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.6"/><rect x="240" y="214" width="90" height="30" rx="4" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.6"/>
<line x1="120" y1="229" x2="240" y2="229" stroke="#2e7d32" stroke-width="4" stroke-linecap="round"/>
<text x="180" y="268" font-size="11" text-anchor="middle" font-weight="bold" fill="#c62828">NO ONE IN LINE WITH THE PULL</text>
<circle cx="40" cy="314" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="40" y1="319" x2="40" y2="332" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="110" cy="314" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="110" y1="319" x2="110" y2="332" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="180" cy="314" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="180" y1="319" x2="180" y2="332" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
<line x1="320" y1="282" x2="320.0" y2="299.0" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M320,304 L322.5,299.0 L317.5,299.0 Z" fill="currentColor" stroke="none"/><line x1="320" y1="282" x2="320.0" y2="259.0" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M320,254 L317.5,259.0 L322.5,259.0 Z" fill="currentColor" stroke="none"/>
<text x="352" y="318.0" font-size="10.5" text-anchor="end" fill="currentColor">bystanders: at least</text>
<text x="352" y="330.5" font-size="10.5" text-anchor="end" fill="currentColor">1.5 x the strap length</text>
<text x="352" y="343.0" font-size="10.5" text-anchor="end" fill="currentColor">away, out of line</text>
<text x="8" y="372.0" font-size="11.5" font-weight="bold" fill="currentColor">Dig and add traction first. Only a rated strap with no</text>
<text x="8" y="386.5" font-size="11.5" font-weight="bold" fill="currentColor">metal hooks: never rope, chain or a ratchet strap.</text>
<text x="8" y="401.0" font-size="11.5" fill="currentColor">Your strap&#x27;s own printed instructions govern.</text>
<text x="354" y="422" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
