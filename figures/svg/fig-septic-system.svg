<line x1="228" y1="100" x2="360" y2="100" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
<text x="292" y="74" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor">drain field</text>
<text x="292" y="164" font-size="10" text-anchor="middle" fill="#2e7d32">soil filters it;</text>
<text x="292" y="176" font-size="10" text-anchor="middle" fill="#2e7d32">its organisms eat</text>
<text x="292" y="188" font-size="10" text-anchor="middle" fill="#2e7d32">the germs</text>
<line x1="0" y1="266" x2="360" y2="266" stroke="#1e6fc0" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6 4"/><text x="356" y="260" font-size="10" text-anchor="end" fill="#1e6fc0">groundwater</text>
<text x="8" y="296" font-size="11.5" font-weight="bold" fill="currentColor">The tank is alive: no chemicals, no heavy bleach.</text>
<text x="8" y="311" font-size="11.5" font-weight="bold" fill="currentColor">The field can only soak up so much: less water.</text>
<text x="8" y="326" font-size="11.5" fill="currentColor">Know where the lids and field are; no driving over them.</text>
<text x="354" y="348" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
