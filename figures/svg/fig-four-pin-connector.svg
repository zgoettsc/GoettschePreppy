<text x="304" y="80" font-size="10" fill="currentColor">to the</text><text x="304" y="92" font-size="10" fill="currentColor">lights</text>
<text x="130" y="150" font-size="11" font-weight="bold" fill="currentColor">WHITE wire: ground</text>
<rect x="150" y="212" width="200" height="22" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="2"/><text x="330" y="250" font-size="10" text-anchor="end" fill="currentColor">trailer frame</text>
<circle cx="176" cy="204" r="8" fill="white" stroke="currentColor" stroke-width="1.8"/><circle cx="176" cy="204" r="3" fill="currentColor" stroke="currentColor" stroke-width="1.6"/>
<rect x="160" y="212" width="40" height="6" fill="#d97a00" fill-opacity="0.8" stroke="none"/><text x="196" y="186" font-size="10.5" font-weight="bold" fill="#d97a00">ring terminal bolted</text>
<text x="196" y="199" font-size="10.5" font-weight="bold" fill="#d97a00">to BRIGHT metal</text>
<text x="8" y="280.0" font-size="11" font-weight="bold" fill="currentColor">Bad ground: dim lights, signals that flash everything,</text>
<text x="8" y="294.5" font-size="11" font-weight="bold" fill="currentColor">lights that work only at an angle.</text>
<text x="8" y="309.0" font-size="11" fill="currentColor">Wire-brush, bolt back tight; same for each light&#x27;s</text>
<text x="8" y="323.5" font-size="11" fill="currentColor">mounting screws. Dielectric grease in both plug halves</text>
<text x="8" y="338.0" font-size="11" fill="currentColor">at every hitch-up.</text>
<text x="354" y="358" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
