<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 364" width="360" height="364" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-four-pin-connector" aria-label="Trailer 4-pin plug and ground">
