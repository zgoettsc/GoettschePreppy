<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 378" width="360" height="378" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-closure-strips" aria-label="Closure strips, and the wounds to leave open">
<title>Closure strips, and the wounds to leave open</title>
<text x="6" y="18" font-size="12.5" font-weight="bold" fill="#2e7d32">The narrow case: CLOSE with strips</text>
<text x="6" y="34.0" font-size="11" fill="currentColor">clean, fresh, flushed, not deep, straight edges that</text>
<text x="6" y="47.5" font-size="11" fill="currentColor">meet without pulling, sure what is underneath</text>
<rect x="30" y="66" width="300" height="70" rx="10" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
<line x1="70" y1="101" x2="290" y2="101" stroke="#c62828" stroke-width="2" stroke-linecap="round"/>
<rect x="82" y="76" width="14" height="50" rx="2" fill="white" stroke="currentColor" stroke-width="1.4"/><rect x="82" y="76" width="14" height="50" fill="currentColor" fill-opacity="0.06" stroke="none"/>
<rect x="120" y="76" width="14" height="50" rx="2" fill="white" stroke="currentColor" stroke-width="1.4"/><rect x="120" y="76" width="14" height="50" fill="currentColor" fill-opacity="0.06" stroke="none"/>
<rect x="158" y="76" width="14" height="50" rx="2" fill="white" stroke="currentColor" stroke-width="1.4"/><rect x="158" y="76" width="14" height="50" fill="currentColor" fill-opacity="0.06" stroke="none"/>
<rect x="196" y="76" width="14" height="50" rx="2" fill="white" stroke="currentColor" stroke-width="1.4"/><rect x="196" y="76" width="14" height="50" fill="currentColor" fill-opacity="0.06" stroke="none"/>
<rect x="234" y="76" width="14" height="50" rx="2" fill="white" stroke="currentColor" stroke-width="1.4"/><rect x="234" y="76" width="14" height="50" fill="currentColor" fill-opacity="0.06" stroke="none"/>
<rect x="272" y="76" width="14" height="50" rx="2" fill="white" stroke="currentColor" stroke-width="1.4"/><rect x="272" y="76" width="14" height="50" fill="currentColor" fill-opacity="0.06" stroke="none"/>
<text x="180" y="152" font-size="11" text-anchor="middle" fill="currentColor">strips ACROSS the cut, gaps between them</text>
<text x="180" y="168" font-size="10.5" text-anchor="middle" font-style="italic" fill="currentColor">Glue (if used): on the surface only, never inside.</text>
<line x1="4" y1="182" x2="356" y2="182" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
<text x="6" y="204" font-size="12.5" font-weight="bold" fill="#c62828">Most wounds: LEAVE OPEN, pack loosely</text>
<rect x="30" y="218" width="150" height="80" rx="10" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
<path d="M56,258 q12,-20 30,-10 q14,-16 30,-4 q18,-8 34,6 q-10,18 -32,12 q-16,14 -34,4 q-20,8 -28,-8 Z" fill="#c62828" fill-opacity="0.3" stroke="#c62828" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M70,256 q10,-6 18,0 q8,6 16,-2 q10,-6 18,2 q8,4 14,0" fill="none" stroke="white" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M70,256 q10,-6 18,0 q8,6 16,-2 q10,-6 18,2 q8,4 14,0" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="105" y="314" font-size="10.5" text-anchor="middle" fill="currentColor">gauze in loosely; dress over</text>
<text x="194" y="226.0" font-size="11" font-weight="bold" fill="currentColor">Never close:</text>
<text x="194" y="239.5" font-size="11" fill="currentColor">dirty; a puncture; a bite;</text>
<text x="194" y="253.0" font-size="11" fill="currentColor">hours old; infected; deep;</text>
<text x="194" y="266.5" font-size="11" fill="currentColor">crushed; over a joint;</text>
<text x="194" y="280.0" font-size="11" fill="currentColor">edges will not meet;</text>
<text x="194" y="293.5" font-size="11" fill="currentColor">face, hands, genitals.</text>
<rect x="4" y="326" width="352" height="28" rx="5" fill="#c62828" fill-opacity="0.06" stroke="#c62828" stroke-width="1.6"/>
<text x="180" y="345" text-anchor="middle" font-weight="bold" fill="#c62828">Unsure? Leave it open.</text>
<text x="354" y="372" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
