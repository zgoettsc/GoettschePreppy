<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 334" width="360" height="334" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-tsunami-natural-warnings" aria-label="Tsunami natural warnings">
<title>Tsunami natural warnings</title>
<rect x="4" y="6" width="113" height="140" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
