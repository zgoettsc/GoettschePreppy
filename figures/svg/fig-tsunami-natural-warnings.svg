<text x="130" y="172" text-anchor="middle" font-weight="bold" fill="#c62828">GO NOW: high ground or</text><text x="130" y="188" text-anchor="middle" font-weight="bold" fill="#c62828">as far inland as you can</text>
<text x="8" y="294" font-size="11.5" font-weight="bold" fill="currentColor">Any ONE sign: go. Do not wait for an official warning.</text>
<text x="8" y="309" font-size="11.5" fill="currentColor">The first wave may not be the last or the largest.</text>
