<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 304" width="360" height="304" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-sawbuck" aria-label="A sawbuck">
<title>A sawbuck</title>
<line x1="0" y1="220" x2="360" y2="220" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<line x1="90" y1="220" x2="160" y2="90" stroke="#d97a00" stroke-width="7" stroke-linecap="round"/><line x1="170" y1="220" x2="100" y2="90" stroke="#d97a00" stroke-width="7" stroke-linecap="round"/>
<line x1="210" y1="220" x2="280" y2="90" stroke="#d97a00" stroke-width="7" stroke-linecap="round"/><line x1="290" y1="220" x2="220" y2="90" stroke="#d97a00" stroke-width="7" stroke-linecap="round"/>
<line x1="110" y1="160" x2="270" y2="160" stroke="#d97a00" stroke-width="5" stroke-linecap="round"/>
<rect x="60" y="110" width="260" height="30" rx="14" fill="#d97a00" fill-opacity="0.25" stroke="currentColor" stroke-width="1.8"/><text x="300" y="102" font-size="10.5" text-anchor="middle" fill="currentColor">log</text>
<path d="M178,70 L232,70 L222,120 L188,120 Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="205" y="62" font-size="10" text-anchor="middle" fill="currentColor">bow saw</text>
<g opacity="0.32"><circle cx="40" cy="52" r="11" fill="currentColor"/><path d="M40,66 L40,140" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M40,140 L32,218" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M40,140 L50,218" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M44,80 L80,100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="232" y="22.0" font-size="11" font-weight="bold" fill="currentColor">Working height:</text>
<text x="232" y="35.5" font-size="11" fill="currentColor">you stand upright,</text>
<text x="232" y="49.0" font-size="11" fill="currentColor">the wood cannot roll.</text>
<text x="190" y="238" font-size="10.5" text-anchor="middle" fill="currentColor">X-shaped legs, joined by a rail</text>
<text x="8" y="264.0" font-size="11" font-weight="bold" fill="currentColor">Build one: it prevents many injuries.</text>
<text x="8" y="278.5" font-size="11" fill="currentColor">A bow saw cuts logs to length (bucking).</text>
<text x="354" y="298" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
