<text x="242" y="208" font-size="10" fill="currentColor">spout</text>
<rect x="4" y="260" width="352" height="74" rx="5" fill="#c62828" fill-opacity="0.06" stroke="#c62828" stroke-width="1.6"/>
<text x="12" y="276" font-size="11.5" font-weight="bold" fill="#c62828">CAUSTIC: treat it exactly like bought lye.</text>
<text x="12" y="291" font-size="11.5" fill="#c62828">Goggles, gloves, ventilation, children away.</text>
<text x="12" y="306" font-size="11.5" font-weight="bold" fill="#c62828">Never boil it down: boiling caustic spatters.</text>
<text x="12" y="321" font-size="11.5" fill="#c62828">This is where people get hurt.</text>
<text x="354" y="350" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
