<path d="M150,30 A100,100 0 0 1 226,134" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3"/><line x1="222" y1="126" x2="224.1" y2="132.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M226,138 L226.9,131.4 L221.3,133.3 Z" fill="currentColor" stroke="none"/>
<path d="M226,150 L240,220" fill="none" stroke="#c62828" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 3"/><text x="244" y="226" font-size="9.5" fill="#c62828">glance: block or dirt</text>
<text x="120" y="246" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor">feet apart, back from the block</text>
<text x="6" y="30.0" font-size="10.5" font-weight="bold" fill="#c62828">Nobody near you</text>
<text x="6" y="42.5" font-size="10.5" font-weight="bold" fill="#c62828">while you split,</text>
<text x="6" y="55.0" font-size="10.5" font-weight="bold" fill="#c62828">especially children.</text>
<text x="8" y="278.0" font-size="11" fill="currentColor">Maul for splitting. Wedges and a sledge for knotty wood.</text>
<text x="8" y="292.5" font-size="11" font-weight="bold" fill="currentColor">Stop when you are tired: most injuries come on a tired swing.</text>
<text x="354" y="312" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
