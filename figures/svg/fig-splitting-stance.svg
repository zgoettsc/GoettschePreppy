<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 318" width="360" height="318" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-splitting-stance" aria-label="Splitting stance and block height">
<title>Splitting stance and block height</title>
<line x1="0" y1="230" x2="360" y2="230" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<rect x="200" y="178" width="54" height="52" rx="3" fill="#d97a00" fill-opacity="0.35" stroke="currentColor" stroke-width="1.8"/><rect x="206" y="144" width="42" height="34" rx="3" fill="#d97a00" fill-opacity="0.2" stroke="currentColor" stroke-width="1.6"/>
<text x="227" y="202" font-size="10" text-anchor="middle" fill="currentColor">block</text><text x="227" y="164" font-size="10" text-anchor="middle" fill="currentColor">round</text>
<text x="262" y="180.0" font-size="10.5" font-weight="bold" fill="currentColor">about knee</text>
<text x="262" y="192.5" font-size="10.5" font-weight="bold" fill="currentColor">height</text>
