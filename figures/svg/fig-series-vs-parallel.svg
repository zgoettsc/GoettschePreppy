<line x1="156" y1="88" x2="156" y2="100" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="204" y1="88" x2="204" y2="100" stroke="#c62828" stroke-width="1.6" stroke-linecap="round"/>
<rect x="264" y="32" width="84" height="56" rx="2" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.6"/><line x1="292.0" y1="32" x2="292.0" y2="88" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/><line x1="320.0" y1="32" x2="320.0" y2="88" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/><line x1="264" y1="60.0" x2="348" y2="60.0" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/><text x="306.0" y="64.5" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor">about 20 V</text>
