<circle cx="234" cy="464" r="3.2" fill="currentColor" stroke="currentColor" stroke-width="1.2"/><text x="227" y="469" font-size="14" text-anchor="end" font-weight="bold" fill="currentColor">−</text><circle cx="282" cy="464" r="3.2" fill="#c62828" stroke="#c62828" stroke-width="1.2"/><text x="289" y="469" font-size="14" font-weight="bold" fill="#c62828">+</text>
<rect x="140" y="502" width="24" height="16" rx="3" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.4"/><text x="152" y="514" font-size="10.5" text-anchor="middle" font-weight="bold" fill="currentColor">Y−</text>
<rect x="196" y="502" width="24" height="16" rx="3" fill="#c62828" fill-opacity="0.15" stroke="#c62828" stroke-width="1.4"/><text x="208" y="514" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#c62828">Y+</text>
<text x="108" y="514" font-size="11.5" text-anchor="end" fill="currentColor">Y-branch</text><text x="232" y="514" font-size="11.5" fill="currentColor">Y-branch</text>
<line x1="152" y1="518" x2="152" y2="532" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="208" y1="518" x2="208" y2="532" stroke="#c62828" stroke-width="1.6" stroke-linecap="round"/>
<rect x="150" y="532" width="60" height="16" rx="3" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.2"/><text x="180" y="544" font-size="11" text-anchor="middle" fill="currentColor">to station</text>
<text x="180" y="570" text-anchor="middle" font-weight="bold" fill="currentColor">Pair: about 20 V; the currents add.</text>
<text x="180" y="588" font-size="12" text-anchor="middle" fill="currentColor">Cold raises voltage, never current: winter cannot</text>
<text x="180" y="603" font-size="12" text-anchor="middle" fill="currentColor">push a parallel pair over a voltage ceiling.</text>
<text x="180" y="618" font-size="12" text-anchor="middle" fill="currentColor">Too much current is normally just clipped (stay under</text>
<text x="180" y="633" font-size="12" text-anchor="middle" fill="currentColor">a max current if the station&#x27;s manual lists one).</text>
<text x="10" y="656" font-size="11" font-style="italic" fill="currentColor">Voltages are examples: use your own panel labels.</text>
<text x="354" y="668" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
