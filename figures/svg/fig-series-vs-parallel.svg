<circle cx="156" cy="100" r="3.2" fill="currentColor" stroke="currentColor" stroke-width="1.2"/><text x="149" y="105" font-size="14" text-anchor="end" font-weight="bold" fill="currentColor">−</text><circle cx="204" cy="100" r="3.2" fill="#c62828" stroke="#c62828" stroke-width="1.2"/><text x="211" y="105" font-size="14" font-weight="bold" fill="#c62828">+</text>
<circle cx="282" cy="100" r="3.2" fill="currentColor" stroke="currentColor" stroke-width="1.2"/><text x="275" y="105" font-size="14" text-anchor="end" font-weight="bold" fill="currentColor">−</text><circle cx="330" cy="100" r="3.2" fill="#c62828" stroke="#c62828" stroke-width="1.2"/><text x="337" y="105" font-size="14" font-weight="bold" fill="#c62828">+</text>
<path d="M30,100 L30,124 L150,124" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M330,100 L330,124 L210,124" fill="none" stroke="#c62828" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="150" y="116" width="60" height="16" rx="3" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.2"/><text x="180" y="128" font-size="11" text-anchor="middle" fill="currentColor">to station</text>
<text x="180" y="152" text-anchor="middle" font-weight="bold" fill="currentColor">String: about 60 V (20 + 20 + 20)</text>
<text x="180" y="168" font-size="12" text-anchor="middle" fill="currentColor">Current stays at the weakest panel&#x27;s level.</text>
<rect x="10" y="180" width="340" height="74" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.4"/>
<text x="20" y="198" font-size="12.5" font-weight="bold" fill="currentColor">COLD-VOLTAGE CHECK, every series string</text>
<text x="20" y="213" font-size="12.5" fill="currentColor">Add the label Voc of every panel in the string,</text>
<text x="20" y="228" font-size="12.5" fill="currentColor">then × 1.20. The result must be BELOW the station&#x27;s</text>
<text x="20" y="243" font-size="12.5" fill="currentColor">max PV input voltage, with a margin.</text>
<line x1="95" y1="254" x2="95.0" y2="265.0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M95,272 L98.5,265.0 L91.5,265.0 Z" fill="currentColor" stroke="none"/><line x1="265" y1="254" x2="265.0" y2="265.0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M265,272 L268.5,265.0 L261.5,265.0 Z" fill="currentColor" stroke="none"/>
<rect x="10" y="274" width="164" height="76" rx="6" fill="#2e7d32" fill-opacity="0.08" stroke="#2e7d32" stroke-width="1.8"/>
<path d="M18,290.8 L24.08,298 L34,282" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="40" y="293" font-size="12.5" font-weight="bold" fill="#2e7d32">HIGH input-voltage</text>
<text x="40" y="308" font-size="12.5" font-weight="bold" fill="#2e7d32">ceiling station</text>
<text x="18" y="328" font-size="12" fill="currentColor">Series string OK, if the</text>
<text x="18" y="342" font-size="12" fill="currentColor">cold check passes.</text>
<rect x="186" y="274" width="164" height="76" rx="6" fill="#c62828" fill-opacity="0.08" stroke="#c62828" stroke-width="1.8"/>
<line x1="194" y1="282" x2="209" y2="297" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><line x1="194" y1="297" x2="209" y2="282" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
<text x="216" y="293" font-size="12.5" font-weight="bold" fill="#c62828">LOW input-voltage</text>
<text x="216" y="308" font-size="12.5" font-weight="bold" fill="#c62828">ceiling station</text>
<text x="194" y="328" font-size="12" font-weight="bold" fill="#c62828">NEVER a series string.</text>
<text x="194" y="342" font-size="12" fill="#c62828">Kills the input for good.</text>
<line x1="10" y1="366" x2="350" y2="366" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
<text x="10" y="386" font-size="14" font-weight="bold" fill="currentColor">PARALLEL: all + together, all − together</text>
<rect x="60" y="398" width="84" height="56" rx="2" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.6"/><line x1="88.0" y1="398" x2="88.0" y2="454" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/><line x1="116.0" y1="398" x2="116.0" y2="454" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/><line x1="60" y1="426.0" x2="144" y2="426.0" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/><text x="102.0" y="430.5" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor">about 20 V</text>
<line x1="78" y1="454" x2="78" y2="464" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="126" y1="454" x2="126" y2="464" stroke="#c62828" stroke-width="1.6" stroke-linecap="round"/>
<rect x="216" y="398" width="84" height="56" rx="2" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.6"/><line x1="244.0" y1="398" x2="244.0" y2="454" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/><line x1="272.0" y1="398" x2="272.0" y2="454" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/><line x1="216" y1="426.0" x2="300" y2="426.0" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/><text x="258.0" y="430.5" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor">about 20 V</text>
