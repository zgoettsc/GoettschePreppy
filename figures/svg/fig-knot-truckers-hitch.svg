<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" width="360" height="310" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-knot-truckers-hitch" aria-label="Trucker&#x27;s hitch">
<title>Trucker&#x27;s hitch</title>
<rect x="10" y="170" width="300" height="10" rx="2" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="1.6"/><text x="160" y="196" font-size="11" text-anchor="middle" fill="currentColor">trailer bed or rail</text>
<rect x="60" y="80" width="160" height="90" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.6"/><text x="140" y="130" text-anchor="middle" font-weight="bold" fill="currentColor">LOAD</text>
<circle cx="30" cy="166" r="5" fill="currentColor" fill-opacity="0.4" stroke="currentColor" stroke-width="1.6"/><text x="14" y="210.0" font-size="10.5" fill="currentColor">1. far end tied off</text>
<text x="14" y="222.5" font-size="10.5" fill="currentColor">(bowline or two half hitches)</text>
<path d="M300,170 q-10,-2 -10,-12 q0,-8 10,-8" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/><text x="312" y="160" font-size="10.5" fill="currentColor">anchor</text>
<path d="M30,162 L60,80 L220,80 L262,104" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M262,104 C250,110 250,128 262,132 C274,128 274,110 262,104" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="208" y="118" font-size="10.5" text-anchor="end" fill="#2e7d32">2-3. pulley</text><text x="208" y="130" font-size="10.5" text-anchor="end" fill="#2e7d32">loop</text>
<path d="M262,104 C272,100 282,110 282,124" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M282,124 L292,152" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="300" y="130" font-size="10.5" fill="currentColor">4. around</text><text x="300" y="142" font-size="10.5" fill="currentColor">the anchor</text>
<path d="M298,152 C300,140 270,140 264,130" fill="none" stroke="#d97a00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M264,130 C258,124 260,114 268,110 L290,60" fill="none" stroke="#d97a00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="292" y1="56" x2="297.0" y2="43.4" stroke="#d97a00" stroke-width="2.4" stroke-linecap="round"/><path d="M300,36 L293.3,41.9 L300.7,44.9 Z" fill="#d97a00" stroke="none"/>
<text x="306" y="30.0" font-size="10.5" fill="#d97a00">5-6. up</text>
<text x="306" y="42.5" font-size="10.5" fill="#d97a00">through</text>
<text x="306" y="55.0" font-size="10.5" fill="#d97a00">the loop,</text>
<text x="306" y="67.5" font-size="10.5" fill="#d97a00">pull</text>
<text x="14" y="252.0" font-size="11.5" font-weight="bold" fill="currentColor">7. Pinch the tight strands; lock the working end with</text>
<text x="14" y="266.5" font-size="11.5" font-weight="bold" fill="currentColor">two half hitches around both strands below the loop.</text>
<text x="14" y="281.0" font-size="11.5" fill="currentColor">Undo the hitches and the whole thing falls apart at once.</text>
<text x="354" y="304" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
