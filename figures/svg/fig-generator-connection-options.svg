<text x="8" y="486" font-size="10.5" fill="#c62828">cord with two male ends</text>
<path d="M196,59.7 L201.32,66 L210,52" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="216" y="64" font-size="12.5" font-weight="bold" fill="#2e7d32">(a) Extension cord</text>
<text x="196" y="81" font-size="12" fill="currentColor">to one appliance&#x27;s own</text>
<text x="196" y="96" font-size="12" fill="currentColor">plug. Anyone. Always</text>
<text x="196" y="111" font-size="12" fill="currentColor">allowed.</text>
<line x1="4" y1="124" x2="356" y2="124" stroke="currentColor" stroke-width="0.6" stroke-linecap="round" opacity="0.3"/>
<text x="196" y="156" font-size="12.5" font-weight="bold" fill="currentColor">(b) Transfer switch:</text>
<text x="196" y="173" font-size="12" fill="currentColor">circuits on grid OR</text>
<text x="196" y="188" font-size="12" fill="currentColor">generator, never both.</text>
<text x="196" y="203" font-size="12" fill="currentColor">Licensed electrician.</text>
<line x1="4" y1="216" x2="356" y2="216" stroke="currentColor" stroke-width="0.6" stroke-linecap="round" opacity="0.3"/>
<text x="196" y="248" font-size="12.5" font-weight="bold" fill="currentColor">(c) Interlock + inlet:</text>
<text x="196" y="265" font-size="12" fill="currentColor">main and generator</text>
<text x="196" y="280" font-size="12" fill="currentColor">breakers never on</text>
<text x="196" y="295" font-size="12" fill="currentColor">together. Electrician.</text>
<line x1="4" y1="308" x2="356" y2="308" stroke="currentColor" stroke-width="0.6" stroke-linecap="round" opacity="0.3"/>
<text x="196" y="340" font-size="12.5" font-weight="bold" fill="currentColor">(d) Cord-and-plug:</text>
<text x="196" y="357" font-size="12" fill="currentColor">furnace unplugged from</text>
<text x="196" y="372" font-size="12" fill="currentColor">its wall receptacle, into</text>
<text x="196" y="387" font-size="12" fill="currentColor">the generator cord. DC-07</text>
<line x1="4" y1="400" x2="356" y2="400" stroke="currentColor" stroke-width="0.6" stroke-linecap="round" opacity="0.3"/>
<line x1="196" y1="420" x2="209" y2="433" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><line x1="196" y1="433" x2="209" y2="420" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
<text x="216" y="432" font-size="12.5" font-weight="bold" fill="#c62828">(e) Into a wall outlet:</text>
<text x="196" y="449" font-size="12" font-weight="bold" fill="#c62828">BACKFEED. NEVER.</text>
<text x="196" y="464" font-size="12" fill="#c62828">Kills line workers and</text>
<text x="196" y="479" font-size="12" fill="#c62828">neighbours (floor 30-01).</text>
<line x1="4" y1="492" x2="356" y2="492" stroke="currentColor" stroke-width="0.6" stroke-linecap="round" opacity="0.3"/>
<text x="8" y="508" font-size="11" font-style="italic" fill="currentColor">(b) and (c) need a generator whose manual says it suits</text>
<text x="8" y="522" font-size="11" font-style="italic" fill="currentColor">transfer equipment (240 V). See your manual.</text>
<text x="354" y="534" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
