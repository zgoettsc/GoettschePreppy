<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 530" width="360" height="530" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-splint-joint-above-below" aria-label="Splints: the joint above and the joint below">
<title>Splints: the joint above and the joint below</title>
<text x="6" y="18" font-size="12.5" font-weight="bold" fill="currentColor">1. Forearm: wrist AND elbow held still</text>
<g opacity="0.3"><path d="M20,60 L60,60" fill="none" stroke="currentColor" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M60,60 L232,62" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M232,62 L262,62" fill="none" stroke="currentColor" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M262,60 L300,58" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M262,66 L298,67" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>
<rect x="44" y="73" width="228" height="8" fill="#d97a00" fill-opacity="0.45" stroke="none"/><rect x="40" y="81" width="236" height="7" rx="2" fill="currentColor" fill-opacity="0.3" stroke="currentColor" stroke-width="1.6"/>
<rect x="78" y="45" width="9" height="44" rx="2" fill="#1e6fc0" fill-opacity="0.35" stroke="#1e6fc0" stroke-width="1.4"/>
<rect x="150" y="45" width="9" height="44" rx="2" fill="#1e6fc0" fill-opacity="0.35" stroke="#1e6fc0" stroke-width="1.4"/>
<rect x="222" y="45" width="9" height="44" rx="2" fill="#1e6fc0" fill-opacity="0.35" stroke="#1e6fc0" stroke-width="1.4"/>
