<text x="143" y="38" font-size="10" text-anchor="middle" fill="#c62828">break</text>
<text x="60" y="106" font-size="10.5" text-anchor="middle" font-weight="bold" fill="currentColor">elbow</text><text x="60" y="118" font-size="10" text-anchor="middle" fill="currentColor">(joint above)</text>
<text x="244" y="106" font-size="10.5" text-anchor="middle" font-weight="bold" fill="currentColor">wrist</text><text x="244" y="118" font-size="10" text-anchor="middle" fill="currentColor">(joint below)</text>
<text x="304" y="50" font-size="10" font-weight="bold" fill="#2e7d32">fingers</text>
<text x="304" y="62" font-size="10" font-weight="bold" fill="#2e7d32">showing</text>
<text x="158" y="100" font-size="10" text-anchor="middle" fill="#d97a00">padding</text><text x="186" y="38" font-size="10" fill="#1e6fc0">ties</text>
<line x1="4" y1="134" x2="356" y2="134" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
<text x="6" y="154" font-size="12.5" font-weight="bold" fill="currentColor">2. Lower leg: knee AND ankle held still</text>
<g opacity="0.3"><path d="M14,196 L110,198" fill="none" stroke="currentColor" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><path d="M110,198 L262,200" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M262,200 L290,200 L300,174" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></g>
<rect x="46" y="174" width="262" height="7" fill="#d97a00" fill-opacity="0.45" stroke="none"/><rect x="46" y="212" width="262" height="7" fill="#d97a00" fill-opacity="0.45" stroke="none"/>
<rect x="42" y="167" width="270" height="7" rx="2" fill="currentColor" fill-opacity="0.3" stroke="currentColor" stroke-width="1.6"/><rect x="42" y="219" width="270" height="7" rx="2" fill="currentColor" fill-opacity="0.3" stroke="currentColor" stroke-width="1.6"/>
<rect x="64" y="163" width="9" height="67" rx="2" fill="#1e6fc0" fill-opacity="0.35" stroke="#1e6fc0" stroke-width="1.4"/>
<rect x="140" y="163" width="9" height="67" rx="2" fill="#1e6fc0" fill-opacity="0.35" stroke="#1e6fc0" stroke-width="1.4"/>
<rect x="214" y="163" width="9" height="67" rx="2" fill="#1e6fc0" fill-opacity="0.35" stroke="#1e6fc0" stroke-width="1.4"/>
<rect x="286" y="163" width="9" height="67" rx="2" fill="#1e6fc0" fill-opacity="0.35" stroke="#1e6fc0" stroke-width="1.4"/>
<path d="M176,188 l6,8 l-4,4 l6,8" fill="none" stroke="#c62828" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="110" y="246" font-size="10" text-anchor="middle" fill="currentColor">knee (joint above)</text><text x="262" y="246" font-size="10" text-anchor="middle" fill="currentColor">ankle (joint below)</text>
<text x="312" y="156" font-size="10" font-weight="bold" fill="#2e7d32">toes</text>
<text x="312" y="168" font-size="10" font-weight="bold" fill="#2e7d32">showing</text>
<line x1="4" y1="262" x2="356" y2="262" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
<text x="6" y="282" font-size="12.5" font-weight="bold" fill="currentColor">3. Finger: tape it to its neighbour</text>
<g opacity="0.3"><path d="M70,400 L70,330" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M90,400 L90,322" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></g>
<rect x="77" y="326" width="6" height="70" fill="#d97a00" fill-opacity="0.6" stroke="none"/>
<rect x="58" y="338" width="44" height="10" rx="2" fill="#1e6fc0" fill-opacity="0.4" stroke="#1e6fc0" stroke-width="1.4"/><rect x="58" y="370" width="44" height="10" rx="2" fill="#1e6fc0" fill-opacity="0.4" stroke="#1e6fc0" stroke-width="1.4"/>
<text x="116" y="330.0" font-size="11" fill="currentColor">Two bands of tape,</text>
<text x="116" y="343.5" font-size="11" fill="currentColor">padding between the</text>
<text x="116" y="357.0" font-size="11" fill="currentColor">fingers, joints left free</text>
<text x="116" y="370.5" font-size="11" fill="currentColor">to bend.</text>
<text x="66" y="418" font-size="10" font-style="italic" fill="currentColor">injured + neighbour</text>
<rect x="6" y="430" width="348" height="82" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6"/>
<text x="14" y="446" font-size="11.5" font-weight="bold" fill="currentColor">Splint it as found: do not straighten it.</text>
<text x="14" y="461" font-size="11.5" fill="currentColor">Check colour, warmth, pulse, feeling and wiggle</text>
<text x="14" y="476" font-size="11.5" fill="currentColor">BEFORE and AFTER. Worse? Loosen it at once.</text>
<text x="14" y="491" font-size="11.5" font-weight="bold" fill="currentColor">Re-check often: swelling builds for hours.</text>
<text x="354" y="524" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
