<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 256" width="360" height="256" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-four-stages-of-a-resource" aria-label="Four stages of a resource">
<title>Four stages of a resource</title>
<text x="46" y="22" font-size="10.5" text-anchor="middle" font-weight="bold" fill="currentColor">1. STOCK</text><text x="46" y="36" font-size="9.5" text-anchor="middle" fill="currentColor">only shrinks</text>
<line x1="80" y1="100" x2="91.0" y2="100.0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M96,100 L91.0,97.5 L91.0,102.5 Z" fill="currentColor" stroke="none"/>
<text x="135" y="22" font-size="10.5" text-anchor="middle" font-weight="bold" fill="currentColor">2. EXTEND</text><text x="135" y="36" font-size="9.5" text-anchor="middle" fill="currentColor">shrinks slower</text>
<line x1="169" y1="100" x2="180.0" y2="100.0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M185,100 L180.0,97.5 L180.0,102.5 Z" fill="currentColor" stroke="none"/>
<text x="224" y="22" font-size="10.5" text-anchor="middle" font-weight="bold" fill="currentColor">3. SUBSTITUTE</text><text x="224" y="36" font-size="9.5" text-anchor="middle" fill="currentColor">usually worse</text>
<line x1="258" y1="100" x2="269.0" y2="100.0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M274,100 L269.0,97.5 L269.0,102.5 Z" fill="currentColor" stroke="none"/>
<text x="313" y="22" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#2e7d32">4. PRODUCE</text><text x="313" y="36" font-size="9.5" text-anchor="middle" fill="currentColor">on and on</text>
<path d="M14,130 L46,70 L78,130 Z" fill="#d97a00" fill-opacity="0.5" stroke="#d97a00" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M106,130 L132,92 L158,130 Z" fill="#d97a00" fill-opacity="0.5" stroke="#d97a00" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="200" y="96" width="30" height="34" rx="4" fill="#1e6fc0" fill-opacity="0.3" stroke="#1e6fc0" stroke-width="1.6"/><path d="M196,90 q19,-14 38,0" fill="none" stroke="#1e6fc0" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M314,130 L314,74" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M314,96 q-20,-6 -24,-22 q18,2 24,16 M314,86 q18,-8 22,-24 q-18,2 -22,18" fill="#2e7d32" fill-opacity="0.3" stroke="#2e7d32" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="4" y1="132" x2="356" y2="132" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
<path d="M98,146 v8 h168 v-8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="182" y="170" font-size="10.5" text-anchor="middle" font-style="italic" fill="currentColor">stages 2 and 3 buy time</text>
<text x="8" y="200" font-size="11.5" font-weight="bold" fill="currentColor">A supply is only really solved at stage 4.</text>
<text x="8" y="215" font-size="11.5" fill="currentColor">No stage 4: it has a deadline, and the deadline sets</text>
<text x="8" y="230" font-size="11.5" fill="currentColor">the plan. Class C items stop at stage 1 (→ 23-01).</text>
<text x="354" y="250" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
