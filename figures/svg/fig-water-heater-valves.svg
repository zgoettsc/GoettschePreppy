<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 416" width="360" height="416" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-water-heater-valves" aria-label="Water heater valves for draining">
<title>Water heater valves for draining</title>
<rect x="150" y="70" width="80" height="220" rx="14" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="2"/>
<text x="190.0" y="170" text-anchor="middle" font-weight="bold" fill="currentColor">TANK</text>
<line x1="172" y1="70" x2="172" y2="20" stroke="#1e6fc0" stroke-width="8" stroke-linecap="round" opacity="0.5"/><line x1="208" y1="70" x2="208" y2="20" stroke="#c62828" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
<text x="168" y="14" font-size="10.5" text-anchor="end" font-weight="bold" fill="#1e6fc0">cold in</text><text x="212" y="14" font-size="10.5" font-weight="bold" fill="#c62828">hot out</text>
<rect x="164" y="36" width="16" height="14" rx="2" fill="currentColor" fill-opacity="0.3" stroke="currentColor" stroke-width="1.6"/><line x1="156" y1="43" x2="188" y2="43" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
<circle cx="18" cy="52" r="10" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.6"/><text x="18" y="56" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor">2</text>
<text x="34" y="48" font-size="11" font-weight="bold" fill="currentColor">Close the cold</text>
<text x="34" y="61" font-size="11" font-weight="bold" fill="currentColor">inlet valve</text><line x1="124" y1="46" x2="154" y2="44" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/>
<rect x="169" y="220" width="42" height="26" rx="3" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.6"/><circle cx="190" cy="233" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="190" y1="233" x2="190" y2="225" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="18" cy="200" r="10" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.6"/><text x="18" y="204" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor">1</text>
<text x="34" y="196" font-size="11" font-weight="bold" fill="currentColor">Heat OFF</text>
<text x="34" y="209" font-size="11" fill="currentColor">gas: knob to OFF</text>
<text x="34" y="222" font-size="11" fill="currentColor">(not pilot);</text>
<text x="34" y="235" font-size="11" fill="currentColor">electric: its</text>
<text x="34" y="248" font-size="11" fill="currentColor">breaker off</text><line x1="132" y1="233" x2="169" y2="233" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/>
<line x1="0" y1="334" x2="360" y2="334" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
<rect x="226" y="264" width="18" height="12" rx="2" fill="currentColor" fill-opacity="0.3" stroke="currentColor" stroke-width="1.6"/>
<path d="M244,270 C270,270 260,294 270,296" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M256,292 L261,332 L299,332 L304,292" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="280" y="324" font-size="10" text-anchor="middle" fill="currentColor">bucket</text>
<circle cx="254" cy="200" r="10" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.6"/><text x="254" y="204" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor">4</text>
<text x="268" y="196" font-size="11" font-weight="bold" fill="currentColor">Drain valve</text>
<text x="268" y="209" font-size="11" fill="currentColor">at the base:</text>
<text x="268" y="222" font-size="11" fill="currentColor">hose or bucket,</text>
<text x="268" y="235" font-size="11" fill="currentColor">open SLOWLY.</text>
<text x="268" y="248" font-size="11" font-weight="bold" fill="#c62828">SCALDING.</text>
<text x="268" y="261" font-size="11" fill="#c62828">Gloves, long</text>
<text x="268" y="274" font-size="11" fill="#c62828">sleeves,</text>
<text x="268" y="287" font-size="11" fill="#c62828">children out.</text>
<circle cx="254" cy="52" r="10" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.6"/><text x="254" y="56" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor">3</text>
<text x="268" y="48" font-size="11" font-weight="bold" fill="currentColor">Open a hot tap</text>
<text x="268" y="61" font-size="11" fill="currentColor">higher in the</text>
<text x="268" y="74" font-size="11" fill="currentColor">house (lets</text>
<text x="268" y="87" font-size="11" fill="currentColor">air in)</text>
<path d="M300,108 l0,-6 l20,0 l0,10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M320,116 q-2,6 0,10 M326,116 q-2,6 0,10" fill="none" stroke="#1e6fc0" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="8" y="358.0" font-size="11.5" fill="currentColor">First gallon or two: sediment. Let it settle.</text>
<text x="8" y="372.5" font-size="11.5" font-weight="bold" fill="currentColor">Heat back on only when the tank is full again:</text>
<text x="8" y="387.0" font-size="11.5" font-weight="bold" fill="currentColor">inlet open, hot tap running with no air.</text>
<text x="354" y="410" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
