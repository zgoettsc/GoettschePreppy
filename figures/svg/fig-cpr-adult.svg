<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 347" width="360" height="347" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-cpr-adult" aria-label="Adult CPR hand position">
<title>Adult CPR hand position</title>
<line x1="0" y1="204" x2="360" y2="204" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
<g opacity="0.55"><circle cx="72.0" cy="87.0" r="12.0" fill="#1e6fc0"/><path d="M78.0,109.0 L112.0,155.0" fill="none" stroke="#1e6fc0" stroke-width="22.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M112.0,155.0 L116.0,201.0 L164.0,203.0" fill="none" stroke="#1e6fc0" stroke-width="15.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M78.0,109.0 L72.0,171.0" fill="none" stroke="#1e6fc0" stroke-width="9.0" stroke-linecap="round" stroke-linejoin="round"/></g>
<g opacity="0.32"><circle cx="24.0" cy="190.0" r="13.0" fill="currentColor"/><path d="M42.0,191.0 L130.0,191.0" fill="none" stroke="currentColor" stroke-width="26.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M128.0,194.0 L206.0,196.0 L240.0,190.0" fill="none" stroke="currentColor" stroke-width="16.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M50.0,198.0 L110.0,200.0" fill="none" stroke="currentColor" stroke-width="9.0" stroke-linecap="round" stroke-linejoin="round"/></g>
<rect x="63.0" y="165.0" width="18" height="10" rx="4" fill="#1e6fc0" fill-opacity="0.5" stroke="#1e6fc0" stroke-width="1.4"/>
<line x1="46.0" y1="137.0" x2="46.0" y2="165.0" stroke="#c62828" stroke-width="2.4" stroke-linecap="round"/><path d="M46.0,173.0 L50.0,165.0 L42.0,165.0 Z" fill="#c62828" stroke="none"/>
<text x="8" y="127.0" font-size="11.5" font-weight="bold" fill="#c62828">about 2 in</text>
<text x="4" y="28.0" font-size="15" font-weight="bold" fill="currentColor">ADULT</text>
<rect x="242" y="18" width="112" height="96" rx="6" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
<text x="298" y="32" font-size="10.5" text-anchor="middle" fill="currentColor">hands</text>
<path d="M252,80 q40,-10 90,0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/><text x="298" y="106" font-size="10" text-anchor="middle" fill="currentColor">centre of chest</text>
<rect x="274" y="62" width="48" height="16" rx="7" fill="#1e6fc0" fill-opacity="0.25" stroke="#1e6fc0" stroke-width="1.6"/><rect x="270" y="48" width="56" height="16" rx="7" fill="#1e6fc0" fill-opacity="0.4" stroke="#1e6fc0" stroke-width="1.6"/>
<text x="298" y="60" font-size="9" text-anchor="middle" fill="currentColor">fingers laced</text>
<text x="8" y="232" font-size="12" font-weight="bold" fill="currentColor">Hands</text><text x="74" y="232" font-size="12" fill="currentColor">heel of 1 hand, other on top</text>
<text x="8" y="249" font-size="12" font-weight="bold" fill="currentColor">Depth</text><text x="74" y="249" font-size="12" fill="currentColor">about 2 in (5 cm)</text>
<text x="8" y="266" font-size="12" font-weight="bold" fill="currentColor">Rate</text><text x="74" y="266" font-size="12" fill="currentColor">100 to 120 a minute (Stayin&#x27; Alive)</text>
<text x="8" y="283" font-size="12" font-weight="bold" fill="currentColor">Rhythm</text><text x="74" y="283" font-size="12" fill="currentColor">30 : 2, one or two rescuers</text>
<text x="8" y="300" font-size="12" font-weight="bold" fill="currentColor">Recoil</text><text x="74" y="300" font-size="12" fill="currentColor">let the chest come fully back up</text>
<text x="8" y="323" font-size="11.5" font-weight="bold" fill="#c62828">Pulled from water: breaths first. Never hands-only.</text>
<text x="354" y="341" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
