<text x="186" y="34" font-size="10.5" fill="currentColor">wind, water</text>
<text x="232" y="70.0" font-size="10.5" font-weight="bold" fill="#c62828">EXTREMITIES</text>
<text x="232" y="83.5" font-size="10.5" fill="#c62828">head, hands,</text>
<text x="232" y="97.0" font-size="10.5" fill="#c62828">feet, face:</text>
<text x="232" y="110.5" font-size="10.5" fill="#c62828">where frostbite</text>
<text x="232" y="124.0" font-size="10.5" fill="#c62828">happens</text>
<text x="8" y="290" font-size="11" font-weight="bold" fill="currentColor">BASE: moves sweat off the skin. Cotton holds sweat, chills you.</text>
<text x="8" y="305" font-size="11" fill="currentColor">MID: traps air. That IS the warmth. Squashed or wet: none.</text>
<text x="8" y="320" font-size="11" fill="currentColor">SHELL: blocks wind and water.</text>
<text x="8" y="335" font-size="11" font-weight="bold" fill="currentColor">Several thin layers beat one thick one; shed heat</text>
<text x="8" y="350" font-size="11" font-weight="bold" fill="currentColor">before you sweat.</text>
<text x="354" y="372" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
