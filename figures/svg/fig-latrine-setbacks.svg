<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 532" width="360" height="532" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-latrine-setbacks" aria-label="Latrine setback distances">
<title>Latrine setback distances</title>
<text x="8" y="16" font-size="11.5" font-style="italic" fill="currentColor">Seen from above</text>
<line x1="330" y1="30" x2="330.0" y2="220.0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M330,230 L335.0,220.0 L325.0,220.0 Z" fill="currentColor" stroke="none"/><text x="322" y="120" font-size="10.5" text-anchor="end" font-style="italic" fill="currentColor">down</text>
<text x="322" y="133" font-size="10.5" text-anchor="end" font-style="italic" fill="currentColor">hill</text>
<circle cx="70" cy="50" r="14" fill="#1e6fc0" fill-opacity="0.2" stroke="#1e6fc0" stroke-width="2"/><text x="70" y="55" font-size="10" text-anchor="middle" font-weight="bold" fill="#1e6fc0">well</text><text x="70" y="78" font-size="10" text-anchor="middle" font-weight="bold" fill="#1e6fc0">UPHILL</text>
<rect x="170" y="60" width="70" height="46" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.8"/><text x="205" y="88" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor">house</text>
<rect x="110" y="196" width="34" height="30" rx="3" fill="#d97a00" fill-opacity="0.25" stroke="#d97a00" stroke-width="2"/><text x="104" y="216" font-size="11" text-anchor="end" font-weight="bold" fill="#d97a00">latrine</text>
<path d="M10,270 C80,262 200,280 300,268" fill="none" stroke="#1e6fc0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity="0.5"/><text x="20" y="290" font-size="10.5" fill="#1e6fc0">creek or any surface water</text>
<line x1="76" y1="64" x2="120" y2="194" stroke="#2e7d32" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3"/><text x="30" y="132" font-size="11" font-weight="bold" fill="#2e7d32">100 ft</text>
<text x="30" y="145" font-size="11" font-weight="bold" fill="#2e7d32">or more</text>
<line x1="140" y1="196" x2="192" y2="108" stroke="#2e7d32" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3"/><text x="176" y="156" font-size="11" font-weight="bold" fill="#2e7d32">50 ft</text>
<text x="176" y="169" font-size="11" font-weight="bold" fill="#2e7d32">or more</text>
<line x1="127" y1="228" x2="140" y2="266" stroke="#2e7d32" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3"/><text x="150" y="254" font-size="11" font-weight="bold" fill="#2e7d32">100 ft or more</text>
<text x="8" y="316" font-size="11.5" font-style="italic" fill="currentColor">Side view of the pit</text>
<line x1="0" y1="336" x2="360" y2="336" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="0" y="336" width="360" height="120" fill="#d97a00" fill-opacity="0.08" stroke="none"/>
<rect x="130" y="336" width="60" height="50" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.8"/><text x="160" y="366" font-size="11" text-anchor="middle" fill="currentColor">pit</text>
<path d="M0,446 q30,-4 60,0 t60,0 t60,0 t60,0 t60,0 t60,0" fill="none" stroke="#1e6fc0" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><rect x="0" y="446" width="360" height="18" fill="#1e6fc0" fill-opacity="0.25" stroke="none"/>
<text x="8" y="460" font-size="10.5" fill="#1e6fc0">water table</text>
<line x1="220" y1="416" x2="220.0" y2="394.0" stroke="#2e7d32" stroke-width="1.6" stroke-linecap="round"/><path d="M220,388 L217.0,394.0 L223.0,394.0 Z" fill="#2e7d32" stroke="none"/><line x1="220" y1="416" x2="220.0" y2="438.0" stroke="#2e7d32" stroke-width="1.6" stroke-linecap="round"/><path d="M220,444 L223.0,438.0 L217.0,438.0 Z" fill="#2e7d32" stroke="none"/>
<text x="230" y="410" font-size="11" font-weight="bold" fill="#2e7d32">at least 5 ft</text>
<text x="230" y="423" font-size="11" font-weight="bold" fill="#2e7d32">of dry soil</text>
<text x="8" y="490" font-size="11" fill="currentColor">Dig a test hole and wait a day: water or soggy soil = wrong site.</text>
<text x="8" y="504" font-size="11" fill="currentColor">Sandy soil or cracked rock: increase every distance a lot.</text>
<text x="354" y="526" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
