<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" width="360" height="400" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-tornado-vehicle-choices" aria-label="Tornado: choices in a vehicle">
<title>Tornado: choices in a vehicle</title>
<rect x="4" y="6" width="174" height="164" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
<text x="12" y="24" font-size="11" font-weight="bold" fill="#2e7d32">1. Far off: drive at</text><text x="12" y="38" font-size="11" font-weight="bold" fill="#2e7d32">RIGHT ANGLES to its path</text>
<rect x="182" y="6" width="174" height="164" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
<text x="190" y="24" font-size="11" font-weight="bold" fill="#d97a00">2. Caught: park, belt ON,</text><text x="190" y="38" font-size="11" font-weight="bold" fill="#d97a00">head below windows, covered</text>
<rect x="4" y="178" width="174" height="164" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
<text x="12" y="196" font-size="11" font-weight="bold" fill="#d97a00">3. Only if noticeably</text><text x="12" y="210" font-size="11" font-weight="bold" fill="#d97a00">lower than the road</text>
<rect x="182" y="178" width="174" height="164" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
<text x="190" y="196" font-size="11" font-weight="bold" fill="#c62828">4. NEVER under</text><text x="190" y="210" font-size="11" font-weight="bold" fill="#c62828">an overpass</text>
