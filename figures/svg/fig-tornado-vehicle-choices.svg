<text x="8" y="360.0" font-size="11" font-weight="bold" fill="currentColor">A sturdy building always wins: drive to the closest shelter.</text>
<text x="8" y="374.5" font-size="11" fill="currentColor">In the open with no vehicle: lowest spot, flat, head covered.</text>
