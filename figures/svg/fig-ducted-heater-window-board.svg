<text x="240" y="228.0" font-size="10.5" font-weight="bold" fill="#c62828">exhaust: slopes</text>
<text x="240" y="240.5" font-size="10.5" font-weight="bold" fill="#c62828">slightly DOWN</text>
<text x="240" y="253.0" font-size="10.5" font-weight="bold" fill="#c62828">and away</text>
<text x="240" y="270" font-size="10" fill="currentColor">very hot: off siding,</text>
<text x="240" y="282" font-size="10" fill="currentColor">cord, combustibles</text>
<text x="74" y="196" font-size="10" font-weight="bold" fill="#c62828">seal every</text>
<text x="74" y="208" font-size="10" font-weight="bold" fill="#c62828">exhaust joint</text>
<rect x="12" y="44" width="24" height="16" rx="4" fill="#2e7d32" fill-opacity="0.15" stroke="#2e7d32" stroke-width="1.6"/><text x="24" y="56" font-size="9.5" text-anchor="middle" font-weight="bold" fill="#2e7d32">CO</text><path d="M38,43.5 L41.8,48 L48,38" fill="none" stroke="#2e7d32" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="50" font-size="10" fill="#2e7d32">CO alarm in the room,</text>
<text x="52" y="62" font-size="10" fill="#2e7d32">every run</text>
<text x="8" y="320" font-size="11.5" font-weight="bold" fill="currentColor">Board edges: comfort. Exhaust joints: life.</text>
<text x="8" y="335" font-size="11.5" fill="currentColor">End the exhaust away from any window, door or vent;</text>
<text x="8" y="350" font-size="11.5" fill="currentColor">clear snow from it after every storm. Never run it</text>
<text x="8" y="365" font-size="11.5" fill="currentColor">indoors, not even &quot;temporarily&quot;.</text>
<text x="354" y="390" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
