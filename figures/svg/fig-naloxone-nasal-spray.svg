<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 322" width="360" height="322" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-naloxone-nasal-spray" aria-label="Giving naloxone nasal spray">
<title>Giving naloxone nasal spray</title>
<text x="6" y="18" font-size="11.5" font-style="italic" fill="currentColor">Lying on their back, seen from the side</text>
<line x1="0" y1="180" x2="228" y2="180" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
<g opacity="0.3"><circle cx="60" cy="146" r="24" fill="currentColor"/><path d="M84,154 L210,156" fill="none" stroke="currentColor" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/></g>
<path d="M48,124 l-3,-10 l10,6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.7"/>
<rect x="46" y="96" width="8" height="20" rx="3" fill="#1e6fc0" fill-opacity="0.5" stroke="#1e6fc0" stroke-width="1.4"/>
<rect x="34" y="88" width="32" height="8" rx="3" fill="#1e6fc0" fill-opacity="0.4" stroke="#1e6fc0" stroke-width="1.4"/>
<rect x="43" y="56" width="14" height="32" rx="3" fill="#1e6fc0" fill-opacity="0.4" stroke="#1e6fc0" stroke-width="1.4"/>
<g opacity="0.35"><path d="M38,80 L22,58" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M62,80 L78,58" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M50,48 L68,30" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></g>
<line x1="28" y1="24" x2="40.5" y2="41.1" stroke="#c62828" stroke-width="2" stroke-linecap="round"/><path d="M44,46 L42.9,39.4 L38.0,42.9 Z" fill="#c62828" stroke="none"/>
<text x="84" y="42" font-size="10.5" fill="currentColor">thumb on the bottom</text><text x="84" y="54" font-size="10.5" fill="currentColor">of the plunger</text>
<text x="84" y="76" font-size="10.5" fill="currentColor">two fingers either</text><text x="84" y="88" font-size="10.5" fill="currentColor">side of the nozzle</text>
<text x="84" y="108" font-size="10.5" fill="currentColor">nozzle in either</text><text x="84" y="120" font-size="10.5" fill="currentColor">nostril, press firmly</text>
<rect x="238" y="30" width="118" height="120" rx="6" fill="#d97a00" fill-opacity="0.12" stroke="#d97a00" stroke-width="1.6"/>
<text x="246" y="50.0" font-size="11" font-weight="bold" fill="currentColor">No wake-up in</text>
<text x="246" y="63.5" font-size="11" font-weight="bold" fill="currentColor">2 to 3 minutes:</text>
<text x="246" y="77.0" font-size="11" fill="currentColor">next dose with a</text>
<text x="246" y="90.5" font-size="11" font-weight="bold" fill="currentColor">NEW device,</text>
<text x="246" y="104.0" font-size="11" fill="currentColor">either nostril.</text>
<text x="246" y="117.5" font-size="11" fill="currentColor">Keep going until</text>
<text x="246" y="131.0" font-size="11" fill="currentColor">they wake.</text>
<text x="10" y="204" font-size="12.5" font-weight="bold" fill="#d97a00">1</text><text x="28" y="204" font-size="12" fill="currentColor">Spray: press firmly. Each device sprays once.</text>
<text x="10" y="221" font-size="12.5" font-weight="bold" fill="#d97a00">2</text><text x="28" y="221" font-size="12" fill="currentColor">Call 911 if any phone works.</text>
<text x="10" y="238" font-size="12.5" font-weight="bold" fill="#d97a00">3</text><text x="28" y="238" font-size="12" fill="currentColor">Wait 2 to 3 minutes; repeat as in the box.</text>
<text x="10" y="255" font-size="12.5" font-weight="bold" fill="#d97a00">4</text><text x="28" y="255" font-size="12" fill="currentColor">On their side (→ recovery position).</text>
<text x="28" y="272" font-size="12" fill="currentColor">Not breathing normally: start CPR (→ 12-18).</text>
<text x="10" y="289" font-size="12.5" font-weight="bold" fill="#d97a00">5</text><text x="28" y="289" font-size="12" fill="currentColor">Stay, even if they wake: it can wear off.</text>
<text x="354" y="316" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
