<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 388" width="360" height="388" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-watts-and-watt-hours" aria-label="Volts, amps, watts and watt-hours">
<title>Volts, amps, watts and watt-hours</title>
<rect x="10" y="30" width="40" height="60" rx="4" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.8"/><text x="30" y="104" font-size="10" text-anchor="middle" fill="currentColor">tap</text>
<path d="M50,60 C110,60 120,130 190,130 L250,130" fill="none" stroke="#1e6fc0" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" opacity="0.35"/>
<line x1="84" y1="60.0" x2="95.0" y2="60.0" stroke="#1e6fc0" stroke-width="1.4" stroke-linecap="round"/><path d="M100,60.0 L95.0,57.5 L95.0,62.5 Z" fill="#1e6fc0" stroke="none"/>
<line x1="144" y1="102.0" x2="155.0" y2="102.0" stroke="#1e6fc0" stroke-width="1.4" stroke-linecap="round"/><path d="M160,102.0 L155.0,99.5 L155.0,104.5 Z" fill="#1e6fc0" stroke="none"/>
<line x1="194" y1="130" x2="205.0" y2="130.0" stroke="#1e6fc0" stroke-width="1.4" stroke-linecap="round"/><path d="M210,130 L205.0,127.5 L205.0,132.5 Z" fill="#1e6fc0" stroke="none"/>
<path d="M250,130 q16,0 16,24" fill="none" stroke="#1e6fc0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity="0.5"/>
<path d="M236,170 L246,250 L310,250 L320,170 Z" fill="#1e6fc0" fill-opacity="0.08" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="240" y="206" width="76" height="44" fill="#1e6fc0" fill-opacity="0.35" stroke="none"/>
<text x="56" y="24" font-size="12" font-weight="bold" fill="#d97a00">VOLTS (V)</text><text x="56" y="38" font-size="10.5" fill="currentColor">= pressure: how hard it pushes</text>
<text x="130" y="166" font-size="12" font-weight="bold" fill="#d97a00">AMPS (A)</text><text x="130" y="180" font-size="10.5" fill="currentColor">= how much is flowing</text>
<text x="10" y="210" font-size="12" font-weight="bold" fill="#d97a00">WATTS (W) = V × A</text><text x="10" y="224" font-size="10.5" fill="currentColor">= how fast it is used</text>
<text x="196" y="280" font-size="12" font-weight="bold" fill="#d97a00">WATT-HOURS (Wh)</text><text x="196" y="294" font-size="10.5" fill="currentColor">= water in the bucket</text>
<line x1="4" y1="312" x2="356" y2="312" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
<text x="8" y="330" font-size="11.5" font-weight="bold" fill="currentColor">1,000 Wh ÷ 100 W ≈ 10 hours</text>
<text x="8" y="345" font-size="11.5" fill="currentColor">less the losses. Watt-hours = watts × hours.</text>
<text x="8" y="360" font-size="11.5" fill="currentColor">Amp-hours × volts = watt-hours: 100 Ah at 12 V = 1,200 Wh.</text>
<text x="354" y="382" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
