<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="360" height="280" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-lug-star-pattern" aria-label="Lug nut star pattern">
<title>Lug nut star pattern</title>
<text x="90" y="22" text-anchor="middle" font-weight="bold" fill="currentColor">5 lugs</text><circle cx="90" cy="112" r="70" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="2.2"/><circle cx="90" cy="112" r="18" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="1.6"/><path d="M90.0,68.0 L115.9,147.6 L48.2,98.4 L131.8,98.4 L64.1,147.6 L90.0,68.0" fill="none" stroke="#d97a00" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="90.0" cy="68.0" r="11" fill="white" stroke="currentColor" stroke-width="1.8"/><text x="90.0" y="72.5" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor">1</text><circle cx="115.9" cy="147.6" r="11" fill="white" stroke="currentColor" stroke-width="1.8"/><text x="115.9" y="152.1" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor">2</text><circle cx="48.2" cy="98.4" r="11" fill="white" stroke="currentColor" stroke-width="1.8"/><text x="48.2" y="102.9" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor">3</text><circle cx="131.8" cy="98.4" r="11" fill="white" stroke="currentColor" stroke-width="1.8"/><text x="131.8" y="102.9" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor">4</text><circle cx="64.1" cy="147.6" r="11" fill="white" stroke="currentColor" stroke-width="1.8"/><text x="64.1" y="152.1" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor">5</text>
<text x="270" y="22" text-anchor="middle" font-weight="bold" fill="currentColor">6 lugs</text><circle cx="270" cy="112" r="70" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="2.2"/><circle cx="270" cy="112" r="18" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="1.6"/><path d="M270.0,68.0 L270.0,156.0 L308.1,90.0 L231.9,134.0 L308.1,134.0 L231.9,90.0 L270.0,68.0" fill="none" stroke="#d97a00" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="270.0" cy="68.0" r="11" fill="white" stroke="currentColor" stroke-width="1.8"/><text x="270.0" y="72.5" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor">1</text><circle cx="270.0" cy="156.0" r="11" fill="white" stroke="currentColor" stroke-width="1.8"/><text x="270.0" y="160.5" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor">2</text><circle cx="308.1" cy="90.0" r="11" fill="white" stroke="currentColor" stroke-width="1.8"/><text x="308.1" y="94.5" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor">3</text><circle cx="231.9" cy="134.0" r="11" fill="white" stroke="currentColor" stroke-width="1.8"/><text x="231.9" y="138.5" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor">4</text><circle cx="308.1" cy="134.0" r="11" fill="white" stroke="currentColor" stroke-width="1.8"/><text x="308.1" y="138.5" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor">5</text><circle cx="231.9" cy="90.0" r="11" fill="white" stroke="currentColor" stroke-width="1.8"/><text x="231.9" y="94.5" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor">6</text>
<text x="8" y="210" font-size="11.5" font-weight="bold" fill="currentColor">Across the wheel, not round the circle.</text>
<text x="8" y="225" font-size="11.5" fill="currentColor">1. Hand-tight in the star.  2. Lower the vehicle.</text>
<text x="8" y="240" font-size="11.5" fill="currentColor">3. Tighten firmly in the star.  4. Torque from the manual</text>
<text x="8" y="255" font-size="11.5" fill="currentColor">at the first chance; recheck after a short drive.</text>
<text x="354" y="274" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
