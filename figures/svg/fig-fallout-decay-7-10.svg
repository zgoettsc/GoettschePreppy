<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 328" width="360" height="328" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-fallout-decay-7-10" aria-label="Fallout decay, the 7-10 rule">
<title>Fallout decay, the 7-10 rule</title>
<text x="8" y="18" font-size="11.5" font-style="italic" fill="currentColor">Fallout level: each 7 times longer, 10 times less</text>
<rect x="20" y="46" width="60" height="184" rx="2" fill="#c62828" fill-opacity="0.44" stroke="#c62828" stroke-width="1.6"/>
<text x="50" y="38" font-size="10.5" text-anchor="middle" font-weight="bold" fill="currentColor">starting level</text>
<text x="50" y="246" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor">1 hour</text>
<rect x="104" y="92" width="60" height="138" rx="2" fill="#c62828" fill-opacity="0.36" stroke="#c62828" stroke-width="1.6"/>
<text x="134" y="84" font-size="10.5" text-anchor="middle" font-weight="bold" fill="currentColor">about 1/10</text>
<text x="134" y="246" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor">7 hours</text>
<rect x="188" y="138" width="60" height="92" rx="2" fill="#c62828" fill-opacity="0.28" stroke="#c62828" stroke-width="1.6"/>
<text x="218" y="130" font-size="10.5" text-anchor="middle" font-weight="bold" fill="currentColor">about 1/100</text>
<text x="218" y="246" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor">2 days (49 h)</text>
<rect x="272" y="184" width="60" height="46" rx="2" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="1.6"/>
<text x="302" y="176" font-size="10.5" text-anchor="middle" font-weight="bold" fill="currentColor">about 1/1,000</text>
<text x="302" y="246" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor">2 weeks</text>
<line x1="10" y1="230" x2="350" y2="230" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
<text x="8" y="274.0" font-size="11.5" font-weight="bold" fill="currentColor">The first hours are the most dangerous, and</text>
<text x="8" y="288.5" font-size="11.5" font-weight="bold" fill="currentColor">they fade fastest.</text>
<text x="8" y="303.0" font-size="11.5" fill="currentColor">Rule of thumb from HHS REMM; your area&#x27;s officials govern.</text>
<text x="354" y="322" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
