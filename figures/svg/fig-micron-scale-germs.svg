<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 348" width="360" height="348" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-micron-scale-germs" aria-label="Germ sizes and filter pore sizes">
<title>Germ sizes and filter pore sizes</title>
<text x="6" y="18" font-size="11.5" font-weight="bold" fill="currentColor">Size in microns (each step is 10 times the last)</text>
<line x1="20" y1="200" x2="340" y2="200" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
<line x1="20.0" y1="200" x2="20.0" y2="206" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><text x="20.0" y="220" font-size="10.5" text-anchor="middle" fill="currentColor">0.01</text>
<line x1="100.0" y1="200" x2="100.0" y2="206" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><text x="100.0" y="220" font-size="10.5" text-anchor="middle" fill="currentColor">0.1</text>
<line x1="180.0" y1="200" x2="180.0" y2="206" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><text x="180.0" y="220" font-size="10.5" text-anchor="middle" fill="currentColor">1</text>
<line x1="260.0" y1="200" x2="260.0" y2="206" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><text x="260.0" y="220" font-size="10.5" text-anchor="middle" fill="currentColor">10</text>
<line x1="340.0" y1="200" x2="340.0" y2="206" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><text x="340.0" y="220" font-size="10.5" text-anchor="middle" fill="currentColor">100</text>
<rect x="44.1" y="100" width="87.70000000000002" height="18" rx="9" fill="#c62828" fill-opacity="0.3" stroke="#c62828" stroke-width="1.4"/>
<text x="44.1" y="94" font-size="11" font-weight="bold" fill="#c62828">viruses</text>
<rect x="148.2" y="130" width="80.0" height="18" rx="9" fill="#d97a00" fill-opacity="0.3" stroke="#d97a00" stroke-width="1.4"/>
<text x="148.2" y="124" font-size="11" font-weight="bold" fill="#d97a00">bacteria</text>
<rect x="218.2" y="166" width="55.900000000000034" height="18" rx="9" fill="#1e6fc0" fill-opacity="0.3" stroke="#1e6fc0" stroke-width="1.4"/>
<text x="218.2" y="160" font-size="11" font-weight="bold" fill="#1e6fc0">Giardia, Cryptosporidium</text>
<line x1="138.2" y1="40" x2="138.2" y2="200" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3"/>
<line x1="180.0" y1="40" x2="180.0" y2="200" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3"/>
<text x="135.2" y="50" font-size="10" text-anchor="end" font-weight="bold" fill="currentColor">0.3 micron filter</text><text x="135.2" y="62" font-size="9.5" text-anchor="end" fill="currentColor">stops bacteria</text>
<text x="183.0" y="50" font-size="10" font-weight="bold" fill="currentColor">1 micron filter</text><text x="183.0" y="62" font-size="9.5" fill="currentColor">stops parasites</text>
<text x="134.2" y="136" font-size="10" text-anchor="end" font-weight="bold" fill="#c62828">most portable filters</text><text x="134.2" y="148" font-size="10" text-anchor="end" font-weight="bold" fill="#c62828">do NOT stop these</text>
<text x="340" y="236" font-size="9.5" text-anchor="end" font-style="italic" fill="currentColor">germ sizes approximate</text>
<text x="8" y="260" font-size="11.5" font-weight="bold" fill="currentColor">Unless the box says viruses, filtered water</text>
<text x="8" y="275" font-size="11.5" font-weight="bold" fill="currentColor">still needs chlorine or boiling.</text>
<text x="8" y="290" font-size="11.5" fill="currentColor">Chlorine works poorly on parasites; iodine does not</text>
<text x="8" y="305" font-size="11.5" fill="currentColor">kill Cryptosporidium. Boiling kills all three.</text>
<text x="8" y="320" font-size="11.5" fill="currentColor">Check whether the pore size is &quot;absolute&quot; or &quot;nominal&quot;.</text>
<text x="354" y="342" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
