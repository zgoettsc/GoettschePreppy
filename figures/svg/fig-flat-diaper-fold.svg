<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 266" width="360" height="266" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-flat-diaper-fold" aria-label="Flat cloth diaper and cover">
<title>Flat cloth diaper and cover</title>
<text x="6" y="18" font-size="12" font-weight="bold" fill="currentColor">1. A flat:</text><text x="6" y="32" font-size="10.5" fill="currentColor">one big square</text>
<rect x="12" y="44" width="84" height="84" rx="2" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.6"/>
<line x1="104" y1="86" x2="116.0" y2="86.0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M122,86 L116.0,83.0 L116.0,89.0 Z" fill="currentColor" stroke="none"/>
<text x="130" y="18" font-size="12" font-weight="bold" fill="currentColor">2. Fold into a pad</text><text x="130" y="32" font-size="10.5" fill="currentColor">(several layers)</text>
<rect x="148" y="48" width="34" height="80" rx="2" fill="white" stroke="currentColor" stroke-width="1.4"/>
<rect x="151" y="45" width="34" height="80" rx="2" fill="white" stroke="currentColor" stroke-width="1.4"/>
<rect x="154" y="42" width="34" height="80" rx="2" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.4"/>
<line x1="200" y1="86" x2="212.0" y2="86.0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M218,86 L212.0,83.0 L212.0,89.0 Z" fill="currentColor" stroke="none"/>
<text x="226" y="18" font-size="12" font-weight="bold" fill="currentColor">3. In the cover</text>
<path d="M230,48 L346,48 L330,86 Q288,140 246,86 Z" fill="#1e6fc0" fill-opacity="0.18" stroke="#1e6fc0" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="274" y="52" width="28" height="60" rx="2" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.4"/>
<rect x="226" y="44" width="18" height="14" rx="3" fill="#1e6fc0" fill-opacity="0.4" stroke="#1e6fc0" stroke-width="1.4"/><rect x="332" y="44" width="18" height="14" rx="3" fill="#1e6fc0" fill-opacity="0.4" stroke="#1e6fc0" stroke-width="1.4"/>
<text x="288" y="140" font-size="10" text-anchor="middle" fill="#1e6fc0">waterproof cover;</text>
<text x="288" y="152" font-size="10" text-anchor="middle" fill="#1e6fc0">snaps or safety pins</text>
<line x1="4" y1="172" x2="356" y2="172" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
<text x="8" y="194" font-size="11.5" font-weight="bold" fill="currentColor">Solids into the toilet system; never into the wash.</text>
<text x="8" y="209" font-size="11.5" fill="currentColor">Lidded DRY pail until wash day (no pail of water:</text>
<text x="8" y="224" font-size="11.5" fill="currentColor">a drowning risk). Hot water and soap; rinse well.</text>
<text x="8" y="239" font-size="11.5" font-weight="bold" fill="currentColor">Never bleach a pail of soiled diapers.</text>
<text x="354" y="260" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
