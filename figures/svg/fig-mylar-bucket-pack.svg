<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 374" width="360" height="374" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-mylar-bucket-pack" aria-label="Packing a bucket with Mylar and oxygen absorbers">
<title>Packing a bucket with Mylar and oxygen absorbers</title>
<path d="M70,80 L80,270 L210,270 L220,80" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="145.0" y="288" font-size="10.5" text-anchor="middle" font-weight="bold" fill="currentColor">1. food-grade bucket</text>
<path d="M78,86 L86,264 L204,264 L212,86" fill="#bbb" fill-opacity="0.3" stroke="#8a8a8a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="88" y="130" width="114" height="132" fill="#d97a00" fill-opacity="0.45" stroke="none"/><text x="145.0" y="220" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor">DRY food</text>
<text x="145.0" y="234" font-size="9.5" text-anchor="middle" fill="currentColor">(about 10% moisture</text><text x="145.0" y="246" font-size="9.5" text-anchor="middle" fill="currentColor">or less)</text>
<rect x="110" y="116" width="18" height="12" rx="2" fill="#1e6fc0" fill-opacity="0.4" stroke="#1e6fc0" stroke-width="1.4"/>
<rect x="136" y="116" width="18" height="12" rx="2" fill="#1e6fc0" fill-opacity="0.4" stroke="#1e6fc0" stroke-width="1.4"/>
<rect x="162" y="116" width="18" height="12" rx="2" fill="#1e6fc0" fill-opacity="0.4" stroke="#1e6fc0" stroke-width="1.4"/>
<text x="228" y="126" font-size="10.5" font-weight="bold" fill="currentColor">3. oxygen absorbers,</text><text x="228" y="139" font-size="10" fill="currentColor">sized to the bucket,</text><text x="228" y="152" font-size="10" font-weight="bold" fill="currentColor">opened LAST</text>
<path d="M90,74 L200,74" fill="none" stroke="#8a8a8a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="110" y="54" width="46" height="14" rx="3" fill="#c62828" fill-opacity="0.35" stroke="#c62828" stroke-width="1.4"/><text x="162" y="65" font-size="9.5" fill="currentColor">iron</text>
<text x="228" y="76" font-size="10.5" font-weight="bold" fill="currentColor">4. seal the Mylar</text>
<text x="64" y="112" font-size="10.5" text-anchor="end" font-weight="bold" fill="currentColor">2. Mylar bag</text>
<rect x="64" y="24" width="162" height="14" rx="3" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.8"/><text x="145.0" y="16" font-size="10.5" text-anchor="middle" fill="currentColor">then the lid</text>
<rect x="100" y="172" width="90" height="36" rx="2" fill="white" stroke="currentColor" stroke-width="1.2"/><text x="106" y="184.0" font-size="8.5" fill="currentColor">contents · weight</text>
<text x="106" y="194.5" font-size="8.5" fill="currentColor">date packed</text>
<text x="106" y="205.0" font-size="8.5" fill="currentColor">ingredient label</text>
<text x="64" y="192" font-size="10.5" text-anchor="end" font-weight="bold" fill="currentColor">5. label</text>
<rect x="290" y="200" width="40" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="288" y="192" width="44" height="10" rx="2" fill="currentColor" fill-opacity="0.3" stroke="currentColor" stroke-width="1.4"/>
<rect x="298" y="238" width="24" height="10" rx="2" fill="#1e6fc0" fill-opacity="0.4" stroke="#1e6fc0" stroke-width="1.2"/>
<rect x="298" y="225" width="24" height="10" rx="2" fill="#1e6fc0" fill-opacity="0.4" stroke="#1e6fc0" stroke-width="1.2"/>
<rect x="298" y="212" width="24" height="10" rx="2" fill="#1e6fc0" fill-opacity="0.4" stroke="#1e6fc0" stroke-width="1.2"/>
<text x="310" y="266.0" font-size="9.5" text-anchor="middle" fill="currentColor">unused absorbers:</text>
<text x="310" y="277.5" font-size="9.5" text-anchor="middle" fill="currentColor">reseal in a jar</text>
<text x="310" y="289.0" font-size="9.5" text-anchor="middle" fill="currentColor">AT ONCE</text>
<text x="8" y="318" font-size="11.5" fill="currentColor">Absorbers are not desiccants: moist food sealed without</text>
<text x="8" y="333" font-size="11.5" fill="currentColor">oxygen can grow botulism.</text>
<text x="8" y="348" font-size="11.5" font-weight="bold" fill="currentColor">No absorbers with sugar, salt, or anything moist or oily.</text>
<text x="354" y="368" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
