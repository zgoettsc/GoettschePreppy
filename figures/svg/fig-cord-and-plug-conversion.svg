<text x="38" y="410" font-size="12" font-weight="bold" fill="#c62828">Never a cord with two male ends.</text>
<text x="38" y="425" font-size="12" font-weight="bold" fill="#c62828">Never a connection into any house wiring.</text>
<text x="8" y="454" font-size="11" fill="currentColor">The plug: (A) a flanged male inlet on the cabinet, fed by a</text>
