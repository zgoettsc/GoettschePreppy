<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="360" height="380" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-wound-packing" aria-label="Packing a wound where a tourniquet cannot go">
<title>Packing a wound where a tourniquet cannot go</title>
<circle cx="64" cy="42.0" r="13.0" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6"/><path d="M58.0,55.0 v6.0 M70.0,55.0 v6.0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M36.0,64.0 Q64,58.0 92.0,64.0 L88.0,138.0 L40.0,138.0 Z" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M36.0,66.0 L24.0,132.0 M92.0,66.0 L104.0,132.0" fill="none" stroke="currentColor" stroke-width="3.5200000000000005" stroke-linejoin="round" stroke-linecap="round"/><path d="M48.0,138.0 L46.0,224.0 M80.0,138.0 L82.0,224.0" fill="none" stroke="currentColor" stroke-width="5.120000000000001" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="42" y="66" width="44" height="68" rx="4" fill="#c62828" fill-opacity="0.18" stroke="#c62828" stroke-width="1.2"/>
<circle cx="64" cy="59.0" r="6" fill="#2e7d32" fill-opacity="0.35" stroke="#2e7d32" stroke-width="2"/>
<circle cx="38.0" cy="72.0" r="6" fill="#2e7d32" fill-opacity="0.35" stroke="#2e7d32" stroke-width="2"/>
<circle cx="52.0" cy="144.0" r="6" fill="#2e7d32" fill-opacity="0.35" stroke="#2e7d32" stroke-width="2"/>
<text x="4" y="248" font-size="11.5" font-weight="bold" fill="#2e7d32">PACK: groin,</text>
<text x="4" y="262" font-size="11.5" font-weight="bold" fill="#2e7d32">armpit, neck</text>
<text x="4" y="286" font-size="11.5" font-weight="bold" fill="#c62828">NEVER pack chest</text>
<text x="4" y="300" font-size="11.5" font-weight="bold" fill="#c62828">or belly: cover</text>
<text x="4" y="314" font-size="11.5" font-weight="bold" fill="#c62828">and press.</text>
<text x="150" y="18" font-size="12.5" font-weight="bold" fill="currentColor">1. Push gauze in with your</text><text x="165" y="33" font-size="12.5" font-weight="bold" fill="currentColor">fingers until it is full.</text>
<path d="M150,104 L200,104 C206,160 258,160 264,104 L350,104" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M200,104 C206,160 258,160 264,104 Z" fill="#c62828" fill-opacity="0.15" stroke="#c62828" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><text x="326" y="98" font-size="10.5" text-anchor="middle" fill="currentColor">skin</text>
<path d="M212,110 l40,0 l-36,10 l32,0 l-28,10 l24,0 l-18,8 l10,0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M252,110 C270,84 290,70 320,70" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="332" cy="70" r="12" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.6"/><text x="332" y="52" font-size="10.5" text-anchor="middle" fill="currentColor">gauze</text>
<path d="M220,58 L230,106 M234,56 L240,106" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" opacity="0.35"/>
<text x="214" y="52" font-size="10.5" text-anchor="end" fill="currentColor">fingers</text>
<text x="150" y="168" font-size="12.5" font-weight="bold" fill="currentColor">2. Press hard on top. Keep</text>
<text x="165" y="183" font-size="12.5" font-weight="bold" fill="currentColor">pressing; do not lift to check.</text>
<path d="M150,270 L200,270 C206,326 258,326 264,270 L350,270" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M200,270 C206,326 258,326 264,270 Z" fill="#c62828" fill-opacity="0.15" stroke="#c62828" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><text x="326" y="264" font-size="10.5" text-anchor="middle" fill="currentColor">skin</text>
<path d="M206,274 C214,314 250,314 258,274 Z" fill="currentColor" fill-opacity="0.35" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="200" y="246" width="64" height="20" rx="8" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.6"/><rect x="204" y="230" width="56" height="16" rx="7" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.6"/>
<text x="232" y="260" font-size="9.5" text-anchor="middle" fill="currentColor">hand</text><text x="232" y="242" font-size="9.5" text-anchor="middle" fill="currentColor">hand</text>
<line x1="212" y1="204" x2="212.0" y2="219.0" stroke="#c62828" stroke-width="2.2" stroke-linecap="round"/><path d="M212,226 L215.5,219.0 L208.5,219.0 Z" fill="#c62828" stroke="none"/>
<line x1="252" y1="204" x2="252.0" y2="219.0" stroke="#c62828" stroke-width="2.2" stroke-linecap="round"/><path d="M252,226 L255.5,219.0 L248.5,219.0 Z" fill="#c62828" stroke="none"/>
<text x="270" y="236" font-size="10.5" fill="currentColor">stacked,</text><text x="270" y="248" font-size="10.5" fill="currentColor">arms straight</text>
<text x="150" y="334" font-size="11.5" fill="currentColor">Hemostatic gauze or plain gauze.</text>
<text x="150" y="348" font-size="11.5" fill="currentColor">Keep them warm and lying flat.</text>
<text x="354" y="374" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
