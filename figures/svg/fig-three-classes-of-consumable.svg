<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" width="360" height="340" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-three-classes-of-consumable" aria-label="Three classes of supply">
<title>Three classes of supply</title>
<rect x="4" y="6" width="113" height="250" rx="6" fill="#2e7d32" fill-opacity="0.08" stroke="#2e7d32" stroke-width="1.6"/>
<text x="60" y="40" font-size="28" text-anchor="middle" font-weight="bold" fill="#2e7d32">A</text><text x="60" y="60" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#2e7d32">RENEWABLE</text>
<text x="12" y="86" font-size="10" fill="currentColor">water</text>
<text x="12" y="100" font-size="10" fill="currentColor">wood</text>
<text x="12" y="114" font-size="10" fill="currentColor">garden food</text>
<text x="12" y="128" font-size="10" fill="currentColor">soap, cordage</text>
<line x1="12" y1="162" x2="109" y2="162" stroke="#2e7d32" stroke-width="1" stroke-linecap="round"/>
<text x="12" y="182" font-size="10.5" font-weight="bold" fill="currentColor">Build the ability</text>
<text x="12" y="196" font-size="10.5" font-weight="bold" fill="currentColor">to produce it.</text>
<rect x="123" y="6" width="113" height="250" rx="6" fill="#d97a00" fill-opacity="0.08" stroke="#d97a00" stroke-width="1.6"/>
<text x="179" y="40" font-size="28" text-anchor="middle" font-weight="bold" fill="#d97a00">B</text><text x="179" y="60" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#d97a00">SUBSTITUTABLE</text>
<text x="131" y="86" font-size="10" fill="currentColor">batteries → daylight</text>
<text x="131" y="100" font-size="10" fill="currentColor">gauze → boiled cloth</text>
<text x="131" y="114" font-size="10" fill="currentColor">tape → wire</text>
<text x="131" y="128" font-size="10" fill="currentColor">screws → lashings</text>
<line x1="131" y1="162" x2="228" y2="162" stroke="#d97a00" stroke-width="1" stroke-linecap="round"/>
<text x="131" y="182" font-size="10.5" font-weight="bold" fill="currentColor">Stock deeply AND</text>
<text x="131" y="196" font-size="10.5" font-weight="bold" fill="currentColor">learn the substitute.</text>
<rect x="242" y="6" width="113" height="250" rx="6" fill="#c62828" fill-opacity="0.08" stroke="#c62828" stroke-width="1.6"/>
<text x="298" y="40" font-size="28" text-anchor="middle" font-weight="bold" fill="#c62828">C</text><text x="298" y="60" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#c62828">IRREPLACEABLE</text>
<text x="250" y="86" font-size="10" fill="currentColor">insulin</text>
<text x="250" y="100" font-size="10" fill="currentColor">epinephrine</text>
<text x="250" y="114" font-size="10" fill="currentColor">seizure and heart</text>
<text x="250" y="128" font-size="10" fill="currentColor">medicines</text>
<line x1="250" y1="162" x2="347" y2="162" stroke="#c62828" stroke-width="1" stroke-linecap="round"/>
<text x="250" y="182" font-size="10.5" font-weight="bold" fill="currentColor">Short list. It sets</text>
<text x="250" y="196" font-size="10.5" font-weight="bold" fill="currentColor">the whole timeline.</text>
<text x="8" y="284" font-size="11.5" font-weight="bold" fill="currentColor">Class C is short, and it decides everything.</text>
<text x="8" y="299" font-size="11.5" fill="currentColor">Well prepared in A and B, the timeline is still set by</text>
<text x="8" y="314" font-size="11.5" fill="currentColor">one item in C.</text>
<text x="354" y="334" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
