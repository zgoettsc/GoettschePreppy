<line x1="124" y1="60" x2="117.0" y2="60.0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M112,60 L117.0,62.5 L117.0,57.5 Z" fill="currentColor" stroke="none"/><line x1="126" y1="60" x2="143.0" y2="60.0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M148,60 L143.0,57.5 L143.0,62.5 Z" fill="currentColor" stroke="none"/>
<line x1="150" y1="64" x2="150" y2="108" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><line x1="110" y1="64" x2="110" y2="76" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/>
<text x="130" y="52" font-size="11.5" text-anchor="middle" font-weight="bold" fill="currentColor">2 to 3 in</text>
<text x="4" y="170.0" font-size="10.5" fill="#2e7d32">2nd tourniquet</text>
<text x="4" y="182" font-size="10.5" fill="#2e7d32">if still bleeding</text>
<text x="204" y="54.0" font-size="11" fill="currentColor">knee</text><line x1="206" y1="58" x2="192.5" y2="81.7" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><path d="M190,86 L194.7,82.9 L190.3,80.4 Z" fill="currentColor" stroke="none"/>
<text x="96" y="202" font-size="11" font-weight="bold" fill="#d97a00">TIME written on the strap</text>
<text x="8" y="34" font-size="10.5" font-style="italic" fill="currentColor">← hip end (toward the body)</text>
<line x1="4" y1="214" x2="356" y2="214" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
<text x="8" y="232" font-size="12" font-weight="bold" fill="currentColor">Wound at or just below a joint: go above the joint</text>
<path d="M10.0,294.0 C80.0,296.0 150.0,306.0 178.0,312.0 C200.0,316.0 260.0,322.0 300.0,326.0 L312.0,290.0 C318.0,282.0 330.0,284.0 332.0,292.0 L328.0,350.0 C320.0,358.0 304.0,354.0 298.0,350.0 C260.0,354.0 210.0,356.0 180.0,360.0 C150.0,364.0 80.0,370.0 10.0,372.0" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M172.0,318.0 q8.0,-6.0 16.0,0" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>
<path d="M199,338 q3.5,-5.6000000000000005 7,-1.4000000000000001 q4.2,-6.3 7,2.1 q1.4000000000000001,6.3 -7,5.6000000000000005 q-5.6000000000000005,2.8000000000000003 -7,-6.3 Z" fill="#c62828" fill-opacity="0.75" stroke="#c62828" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="176.0" y="306" width="12.0" height="60" rx="2" fill="#c62828" fill-opacity="0.25" stroke="#c62828" stroke-width="1.6"/><line x1="168.0" y1="322.0" x2="196.0" y2="350.0" stroke="#c62828" stroke-width="4" stroke-linecap="round"/><rect x="190.0" y="296.0" width="10.0" height="12.0" rx="2" fill="none" stroke="#c62828" stroke-width="1.4"/>
<line x1="164" y1="298" x2="202" y2="372" stroke="#c62828" stroke-width="3.5" stroke-linecap="round"/><line x1="164" y1="372" x2="202" y2="298" stroke="#c62828" stroke-width="3.5" stroke-linecap="round"/>
<text x="182" y="396" font-size="11" text-anchor="middle" font-weight="bold" fill="#c62828">never over the knee or elbow</text>
<rect x="134.0" y="300" width="12.0" height="70" rx="2" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.6"/><line x1="126.0" y1="321.0" x2="154.0" y2="349.0" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><rect x="148.0" y="290.0" width="10.0" height="12.0" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
<path d="M132,279.7 L137.32,286 L146,272" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="8" y="424" font-size="12" font-weight="bold" fill="currentColor">Tighten until the bleeding stops AND there is no</text>
<text x="8" y="439" font-size="12" font-weight="bold" fill="currentColor">pulse below it. Lock the windlass in its clip.</text>
<text x="8" y="454" font-size="12" fill="currentColor">It will hurt a great deal. That is expected.</text>
<text x="8" y="469" font-size="12" font-weight="bold" fill="currentColor">Write the time on it. Never loosen it.</text>
<text x="354" y="494" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
