<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" width="360" height="500" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-tourniquet-placement" aria-label="Where a tourniquet goes">
<title>Where a tourniquet goes</title>
<text x="8" y="16" font-size="11.5" font-style="italic" fill="currentColor">Leg lying flat, seen from the side</text>
