<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" width="360" height="350" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-choking-child-adult" aria-label="Choking age 1 and up: back blows and abdominal thrusts">
<title>Choking age 1 and up: back blows and abdominal thrusts</title>
<line x1="0" y1="228" x2="360" y2="228" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
<text x="6" y="18" font-size="12.5" font-weight="bold" fill="currentColor">1. 5 back blows</text>
<g opacity="0.32"><circle cx="36" cy="88" r="12" fill="currentColor"/><path d="M50,90 L96,76" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M98,80 L100,150 L96,222" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M56,92 L50,128" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g opacity="0.5"><circle cx="110" cy="36" r="12" fill="#1e6fc0"/><path d="M110,50 L114,124" fill="none" stroke="#1e6fc0" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M114,126 L120,176 L118,222" fill="none" stroke="#1e6fc0" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M108,58 L84,64" fill="none" stroke="#1e6fc0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M106,58 L64,100" fill="none" stroke="#1e6fc0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<line x1="94" y1="58" x2="83.3" y2="67.4" stroke="#c62828" stroke-width="2.4" stroke-linecap="round"/><path d="M78,72 L85.6,70.0 L81.0,64.8 Z" fill="#c62828" stroke="none"/>
<text x="60" y="244" font-size="10.5" text-anchor="middle" fill="currentColor">heel of the hand,</text><text x="60" y="256" font-size="10.5" text-anchor="middle" fill="currentColor">between shoulder blades</text>
<line x1="140" y1="6" x2="140" y2="262" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
<text x="146" y="18" font-size="12.5" font-weight="bold" fill="currentColor">2. 5 abdominal thrusts</text>
<g opacity="0.5"><circle cx="220" cy="40" r="12" fill="#1e6fc0"/><path d="M222,54 L226,130" fill="none" stroke="#1e6fc0" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M226,130 L228,222" fill="none" stroke="#1e6fc0" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/></g>
<g opacity="0.32"><circle cx="186" cy="44" r="12" fill="currentColor"/><path d="M186,58 L188,132" fill="none" stroke="currentColor" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M188,132 L186,222" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></g>
<line x1="180" y1="110" x2="226" y2="94" stroke="#1e6fc0" stroke-width="6" stroke-linecap="round" opacity="0.5"/><circle cx="176" cy="112" r="7" fill="#1e6fc0" fill-opacity="0.7" stroke="#1e6fc0" stroke-width="1.6"/>
<line x1="160" y1="126" x2="170.2" y2="109.9" stroke="#c62828" stroke-width="2.4" stroke-linecap="round"/><path d="M174,104 L167.3,108.0 L173.2,111.8 Z" fill="#c62828" stroke="none"/>
<text x="250" y="64" font-size="10.5" fill="currentColor">fist just</text><text x="250" y="76" font-size="10.5" fill="currentColor">above the</text><text x="250" y="88" font-size="10.5" fill="currentColor">navel:</text><text x="250" y="100" font-size="10.5" font-weight="bold" fill="#c62828">IN and UP</text>
<line x1="262" y1="120" x2="262" y2="262" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
<text x="268" y="134" font-size="11.5" font-weight="bold" fill="currentColor">3. Small child:</text><text x="268" y="148" font-size="11.5" font-weight="bold" fill="currentColor">kneel behind</text>
<g opacity="0.5"><circle cx="336" cy="168" r="11" fill="#1e6fc0"/><path d="M336,182 L340,206" fill="none" stroke="#1e6fc0" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M340,206 L330,224 L358,224" fill="none" stroke="#1e6fc0" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></g>
<g opacity="0.32"><circle cx="306" cy="186" r="9" fill="currentColor"/><path d="M306,196 L308,212" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M308,212 L308,224" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="6" y="278.0" font-size="11.5" font-weight="bold" fill="currentColor">Alternate 5 and 5 until it clears or they go limp.</text>
<text x="6" y="292.5" font-size="11.5" fill="currentColor">Pregnant, or too big to reach round: CHEST thrusts.</text>
<text x="6" y="307.0" font-size="11.5" fill="currentColor">Limp: lower them to the ground and start CPR.</text>
<text x="6" y="321.5" font-size="11.5" fill="currentColor">Coughing hard, speaking or crying: do not hit or thrust.</text>
<text x="354" y="344" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
