<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 348" width="360" height="348" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-haybox" aria-label="Haybox cooking">
<title>Haybox cooking</title>
<text x="6" y="18" font-size="12" font-weight="bold" fill="currentColor">1. Full rolling boil,</text><text x="6" y="33" font-size="12" font-weight="bold" fill="currentColor">right through the pot</text>
<line x1="0" y1="170" x2="150" y2="170" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M50,168 c-9.6,-3.5999999999999996 -10.799999999999999,-14.399999999999999 -3.5999999999999996,-24.0 c0,7.199999999999999 4.8,7.199999999999999 4.8,2.4 c4.8,7.199999999999999 7.199999999999999,18.0 -1.2,21.599999999999998 Z" fill="#d97a00" fill-opacity="0.35" stroke="#d97a00" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M74,168 c-11.2,-4.199999999999999 -12.6,-16.799999999999997 -4.199999999999999,-28.0 c0,8.399999999999999 5.6,8.399999999999999 5.6,2.8 c5.6,8.399999999999999 8.399999999999999,21.0 -1.4,25.2 Z" fill="#d97a00" fill-opacity="0.35" stroke="#d97a00" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M98,168 c-8.8,-3.3000000000000003 -9.9,-13.200000000000001 -3.3000000000000003,-22.0 c0,6.6000000000000005 4.4,6.6000000000000005 4.4,2.2 c4.4,6.6000000000000005 6.6000000000000005,16.5 -1.1,19.8 Z" fill="#d97a00" fill-opacity="0.35" stroke="#d97a00" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="30" y="70" width="90" height="74" rx="6" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="2"/><rect x="26" y="62" width="98" height="10" rx="3" fill="currentColor" fill-opacity="0.35" stroke="currentColor" stroke-width="1.6"/>
<circle cx="50" cy="120" r="4" fill="none" stroke="#1e6fc0" stroke-width="1.4"/>
<circle cx="74" cy="100" r="4" fill="none" stroke="#1e6fc0" stroke-width="1.4"/>
<circle cx="98" cy="124" r="4" fill="none" stroke="#1e6fc0" stroke-width="1.4"/>
<circle cx="62" cy="132" r="4" fill="none" stroke="#1e6fc0" stroke-width="1.4"/>
<circle cx="88" cy="86" r="4" fill="none" stroke="#1e6fc0" stroke-width="1.4"/>
<circle cx="104" cy="104" r="4" fill="none" stroke="#1e6fc0" stroke-width="1.4"/>
<circle cx="44" cy="96" r="4" fill="none" stroke="#1e6fc0" stroke-width="1.4"/>
<line x1="146" y1="100" x2="168.0" y2="100.0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M176,100 L168.0,96.0 L168.0,104.0 Z" fill="currentColor" stroke="none"/>
<text x="186" y="18" font-size="12" font-weight="bold" fill="currentColor">2. Covered pot into a</text><text x="186" y="33" font-size="12" font-weight="bold" fill="currentColor">heavily insulated box</text>
<rect x="186" y="52" width="164" height="118" rx="8" fill="#1e6fc0" fill-opacity="0.12" stroke="#1e6fc0" stroke-width="2"/><rect x="200" y="64" width="136" height="96" rx="14" fill="#d97a00" fill-opacity="0.35" stroke="#d97a00" stroke-width="1.2"/>
<rect x="232" y="84" width="72" height="56" rx="6" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="2"/><rect x="228" y="78" width="80" height="8" rx="3" fill="currentColor" fill-opacity="0.35" stroke="currentColor" stroke-width="1.4"/>
<text x="268" y="154" font-size="9.5" text-anchor="middle" fill="currentColor">towels, blankets, straw</text>
<line x1="296" y1="66" x2="296" y2="110" stroke="#c62828" stroke-width="2" stroke-linecap="round"/><circle cx="296" cy="112" r="3" fill="#c62828" stroke="#c62828" stroke-width="1.6"/><rect x="290" y="50" width="30" height="16" rx="2" fill="white" stroke="currentColor" stroke-width="1.2"/><text x="305" y="62" font-size="9.5" text-anchor="middle" font-weight="bold" fill="currentColor">°F</text>
<text x="6" y="196" font-size="12" font-weight="bold" fill="currentColor">Check with a thermometer before serving:</text>
<rect x="6" y="204" width="348" height="20" rx="3" fill="#2e7d32" fill-opacity="0.1" stroke="#2e7d32" stroke-width="1.2"/><text x="12" y="218" font-size="11.5" fill="currentColor">above 140 °F</text><text x="348" y="218" font-size="11.5" text-anchor="end" font-weight="bold" fill="#2e7d32">fine</text>
<rect x="6" y="226" width="348" height="20" rx="3" fill="#d97a00" fill-opacity="0.1" stroke="#d97a00" stroke-width="1.2"/><text x="12" y="240" font-size="11.5" fill="currentColor">just dropped below 140 °F</text><text x="348" y="240" font-size="11.5" text-anchor="end" font-weight="bold" fill="#d97a00">reheat to 165 °F</text>
<rect x="6" y="248" width="348" height="20" rx="3" fill="#c62828" fill-opacity="0.1" stroke="#c62828" stroke-width="1.2"/><text x="12" y="262" font-size="11.5" fill="currentColor">below 140 °F for over 2 hours</text><text x="348" y="262" font-size="11.5" text-anchor="end" font-weight="bold" fill="#c62828">THROW OUT</text>
<text x="8" y="292" font-size="11.5" font-weight="bold" fill="currentColor">Dry beans: soak 5+ hours, THROW AWAY the soak water,</text>
<text x="8" y="307" font-size="11.5" font-weight="bold" fill="currentColor">boil 30+ minutes in fresh water, THEN the box.</text>
<text x="8" y="322" font-size="11.5" fill="currentColor">An overnight haybox is not breakfast.</text>
<text x="354" y="342" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
