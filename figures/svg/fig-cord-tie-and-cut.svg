<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 258" width="360" height="258" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-cord-tie-and-cut" aria-label="Tying and cutting the cord">
<title>Tying and cutting the cord</title>
<text x="6" y="18" font-size="12" font-weight="bold" fill="currentColor">First wait: 1 to 3 minutes, until it stops</text>
<text x="6" y="34" font-size="12" font-weight="bold" fill="currentColor">pulsing. There is no hurry to cut.</text>
<path d="M20,104 C80,88 140,118 200,104 S300,94 340,108" fill="none" stroke="currentColor" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" opacity="0.2"/>
<path d="M20,104 C80,88 140,118 200,104 S300,94 340,108" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>
<text x="20" y="136" font-size="11" font-weight="bold" fill="currentColor">← baby</text><text x="340" y="136" font-size="11" text-anchor="end" font-weight="bold" fill="currentColor">mother →</text>
<rect x="144" y="92" width="8" height="24" rx="2" fill="#d97a00" fill-opacity="0.7" stroke="#d97a00" stroke-width="1.6"/>
<rect x="208" y="92" width="8" height="24" rx="2" fill="#d97a00" fill-opacity="0.7" stroke="#d97a00" stroke-width="1.6"/>
<text x="148" y="82" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#d97a00">tie</text><text x="212" y="82" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#d97a00">tie</text>
<line x1="158" y1="128" x2="197.0" y2="128.0" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M202,128 L197.0,125.5 L197.0,130.5 Z" fill="currentColor" stroke="none"/><line x1="202" y1="128" x2="163.0" y2="128.0" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M158,128 L163.0,130.5 L163.0,125.5 Z" fill="currentColor" stroke="none"/>
<text x="180" y="144" font-size="10.5" text-anchor="middle" fill="currentColor">a few finger-widths</text>
<line x1="180" y1="64" x2="180" y2="116" stroke="#c62828" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/><text x="180" y="58" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#c62828">cut here</text>
<text x="8" y="176" font-size="12" fill="currentColor">String: clean, BOILED, tied tightly.</text>
<text x="8" y="192" font-size="12" fill="currentColor">Blade: BOILED.</text>
<text x="8" y="208" font-size="12" font-weight="bold" fill="currentColor">Never pull on the cord.</text>
<text x="8" y="224" font-size="12" fill="currentColor">The afterbirth comes by itself; keep it in a bowl.</text>
<text x="354" y="252" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
