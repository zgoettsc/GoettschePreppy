<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 252" width="360" height="252" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-recovery-position" aria-label="Recovery position">
<title>Recovery position</title>
<text x="8" y="16" font-size="11.5" font-style="italic" fill="currentColor">Seen from above, lying on the left side</text>
<g opacity="0.33"><circle cx="60" cy="96" r="16" fill="currentColor"/><path d="M78,98 L190,100" fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><path d="M190,104 L300,108 L340,104" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M192,94 L236,142 L292,146" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M84,86 L50,56 L20,50" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M96,110 L66,120 L56,108" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
<line x1="30" y1="112" x2="33.8" y2="108.2" stroke="#c62828" stroke-width="2" stroke-linecap="round"/><path d="M38,104 L31.6,106.1 L35.9,110.4 Z" fill="#c62828" stroke="none"/><text x="8" y="138" font-size="11" font-weight="bold" fill="#c62828">mouth points</text>
<text x="8" y="151" font-size="11" font-weight="bold" fill="#c62828">down</text>
<text x="100" y="66" font-size="10.5" fill="currentColor">head tilted back</text>
<text x="96" y="140" font-size="10.5" fill="currentColor">hand under cheek</text>
<text x="236" y="172" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#2e7d32">top knee bent</text>
<text x="236" y="186" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#2e7d32">forward</text>
<text x="8" y="214.0" font-size="11.5" font-weight="bold" fill="currentColor">Check breathing again and again.</text>
<text x="8" y="228.5" font-size="11.5" fill="currentColor">Stops breathing: on the back, start CPR (→ 12-18).</text>
<text x="354" y="246" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
