<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 424" width="360" height="424" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-anaphylaxis-positions" aria-label="Anaphylaxis: lying positions">
<title>Anaphylaxis: lying positions</title>
<text x="6" y="18" font-weight="bold" fill="currentColor">1. Lying on their back</text>
<text x="6" y="34" font-size="11" fill="currentColor">the usual position</text>
<line x1="0" y1="118" x2="360" y2="118" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
<g opacity="0.32"><circle cx="56.099999999999994" cy="101.9" r="14.95" fill="currentColor"/><path d="M76.8,103.05 L178.0,103.05" fill="none" stroke="currentColor" stroke-width="29.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M175.7,106.5 L265.4,108.8 L304.5,101.9" fill="none" stroke="currentColor" stroke-width="18.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M86.0,111.1 L155.0,113.4" fill="none" stroke="currentColor" stroke-width="10.35" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M62,84 l4,-8 l5,7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.7"/>
<text x="70" y="74" font-size="10.5" font-style="italic" fill="currentColor">face up</text>
<line x1="4" y1="134" x2="356" y2="134" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
<text x="6" y="156" font-weight="bold" fill="currentColor">2. Vomiting or trouble breathing:</text>
<text x="6" y="172" font-size="11" fill="currentColor">lying on their SIDE (seen from above)</text>
<g opacity="0.33"><circle cx="62" cy="232" r="15" fill="currentColor"/><path d="M80,234 L180,236" fill="none" stroke="currentColor" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><path d="M182,230 L232,272 L290,276" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M184,242 L290,246 L330,244" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M90,222 L64,196 L40,194" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>
<line x1="44" y1="244" x2="39.7" y2="249.3" stroke="#c62828" stroke-width="2" stroke-linecap="round"/><path d="M36,254 L42.1,251.2 L37.4,247.4 Z" fill="#c62828" stroke="none"/><text x="6" y="276.0" font-size="10.5" fill="#c62828">mouth</text>
<text x="6" y="288.5" font-size="10.5" fill="#c62828">points down</text>
<text x="236" y="302" font-size="10.5" text-anchor="middle" fill="currentColor">knees bent</text>
<rect x="6" y="320" width="348" height="46" rx="5" fill="#c62828" fill-opacity="0.06" stroke="#c62828" stroke-width="1.6"/>
<text x="16" y="339" font-size="12" font-weight="bold" fill="#c62828">Keep them lying down.</text>
<text x="16" y="354" font-size="12" font-weight="bold" fill="#c62828">Do NOT stand them up or walk them.</text>
<text x="8" y="388.0" font-size="11" fill="currentColor">Second dose if symptoms get worse, continue, or do</text>
<text x="8" y="401.5" font-size="11" fill="currentColor">not get better in 5 minutes (AAP plan; → 02-03).</text>
<text x="354" y="418" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
