<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 315" width="360" height="315" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-cpr-infant" aria-label="Infant CPR thumb and hand positions">
<title>Infant CPR thumb and hand positions</title>
<text x="4" y="24" font-size="15" font-weight="bold" fill="currentColor">INFANT</text><text x="4" y="40" font-size="11" fill="currentColor">under 1 year</text>
<rect x="14" y="130" width="150" height="8" rx="2" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="1.2"/><text x="88" y="154" font-size="10.5" text-anchor="middle" fill="currentColor">firm, flat surface</text>
<g opacity="0.32"><circle cx="36" cy="115.7" r="14.3" fill="currentColor"/><path d="M54.2,117.0 L101.0,117.0" fill="none" stroke="currentColor" stroke-width="26.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M101.0,119.6 L137.4,119.6" fill="none" stroke="currentColor" stroke-width="14.3" stroke-linecap="round" stroke-linejoin="round"/></g>
<path d="M69,106 L69,60 M75,106 L75,60" fill="none" stroke="#1e6fc0" stroke-width="13" stroke-linejoin="round" stroke-linecap="round" opacity="0.55"/>
<rect x="60" y="46" width="24" height="16" rx="6" fill="#1e6fc0" fill-opacity="0.35" stroke="#1e6fc0" stroke-width="1.2"/>
<text x="86" y="64" font-size="10.5" fill="#1e6fc0">or heel of</text><text x="86" y="76" font-size="10.5" fill="#1e6fc0">1 hand</text>
<text x="86" y="88" font-size="10.5" fill="currentColor">just below</text><text x="86" y="100" font-size="10.5" fill="currentColor">nipple line</text>
<line x1="50" y1="70" x2="50.0" y2="97.0" stroke="#c62828" stroke-width="2.2" stroke-linecap="round"/><path d="M50,104 L53.5,97.0 L46.5,97.0 Z" fill="#c62828" stroke="none"/><text x="44" y="64.0" font-size="11" text-anchor="end" font-weight="bold" fill="#c62828">about</text>
<text x="44" y="76.5" font-size="11" text-anchor="end" font-weight="bold" fill="#c62828">1½ in</text>
<text x="256" y="28" font-size="11.5" text-anchor="middle" font-weight="bold" fill="currentColor">First choice:</text><text x="256" y="42" font-size="10.5" text-anchor="middle" fill="currentColor">two thumbs, hands</text><text x="256" y="54" font-size="10.5" text-anchor="middle" fill="currentColor">encircling the chest</text>
<circle cx="256" cy="82" r="14" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="1.4"/>
<rect x="230" y="96" width="52" height="66" rx="20" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.4"/>
<path d="M228,116 q-14,20 2,38 M284,116 q14,20 -2,38" fill="none" stroke="#1e6fc0" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity="0.45"/>
<rect x="247" y="120" width="8" height="18" rx="4" fill="#1e6fc0" fill-opacity="0.6" stroke="#1e6fc0" stroke-width="1.4"/><rect x="257" y="120" width="8" height="18" rx="4" fill="#1e6fc0" fill-opacity="0.6" stroke="#1e6fc0" stroke-width="1.4"/>
<text x="256" y="178" font-size="10" text-anchor="middle" font-style="italic" fill="currentColor">seen from above</text>
<text x="8" y="204" font-size="12" font-weight="bold" fill="currentColor">Depth</text><text x="74" y="204" font-size="12" fill="currentColor">about 1½ in (4 cm)</text>
<text x="8" y="221" font-size="12" font-weight="bold" fill="currentColor">Rate</text><text x="74" y="221" font-size="12" fill="currentColor">100 to 120 a minute</text>
<text x="8" y="238" font-size="12" font-weight="bold" fill="currentColor">Rhythm</text><text x="74" y="238" font-size="12" fill="currentColor">30 : 2 alone; 15 : 2 with two rescuers</text>
<text x="8" y="255" font-size="12" font-weight="bold" fill="currentColor">Breaths</text><text x="74" y="255" font-size="12" fill="currentColor">mouth over mouth AND nose</text>
<text x="8" y="272" font-size="12" font-weight="bold" fill="currentColor">Head</text><text x="74" y="272" font-size="12" fill="currentColor">neutral &quot;sniffing&quot; position, not</text>
<text x="74" y="287" font-size="12" fill="currentColor">tipped far back</text>
<text x="354" y="309" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
