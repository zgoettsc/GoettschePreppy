<rect x="4" y="238" width="352" height="70" rx="5" fill="#c62828" fill-opacity="0.06" stroke="#c62828" stroke-width="1.6"/>
<text x="12" y="254.0" font-size="11" font-weight="bold" fill="#c62828">Never drive or walk into moving water.</text>
<text x="12" y="268.5" font-size="11" fill="#c62828">No depth of flowing water across a road is safe to drive:</text>
