<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 362" width="360" height="362" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-choking-infant" aria-label="Choking infant: back blows and chest thrusts">
<title>Choking infant: back blows and chest thrusts</title>
<text x="8" y="18" font-size="12.5" font-weight="bold" fill="currentColor">1. Face-down, head lower</text>
<g opacity="0.3"><path d="M150,160 L30,172" fill="none" stroke="#1e6fc0" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/></g><text x="120" y="196" font-size="10" text-anchor="middle" fill="currentColor">your thigh</text><g opacity="0.55"><path d="M150,128 L22,146" fill="none" stroke="#1e6fc0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="147" r="9" fill="#1e6fc0"/></g><text x="120" y="118" font-size="10" text-anchor="middle" fill="#1e6fc0">forearm</text><g opacity="0.38"><circle cx="26" cy="128" r="12" fill="currentColor"/><path d="M42,124 L82,118" fill="none" stroke="currentColor" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M82,118 L112,112" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></g>
<g opacity="0.55"><path d="M96,56 L72,100" fill="none" stroke="#1e6fc0" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></g>
<line x1="96" y1="60" x2="74.1" y2="97.1" stroke="#c62828" stroke-width="2.4" stroke-linecap="round"/><path d="M70,104 L77.5,99.1 L70.6,95.1 Z" fill="#c62828" stroke="none"/>
<text x="8" y="220" font-size="11.5" font-weight="bold" fill="currentColor">5 back blows,</text>
<text x="8" y="234" font-size="11.5" fill="currentColor">heel of hand, between</text>
<text x="8" y="248" font-size="11.5" fill="currentColor">the shoulder blades.</text>
<text x="8" y="262" font-size="11.5" fill="currentColor">Hold the jaw, not the throat.</text>
<line x1="180" y1="6" x2="180" y2="280" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
<text x="188" y="18" font-size="12.5" font-weight="bold" fill="currentColor">2. Turn face-up, head lower</text>
<g opacity="0.3"><path d="M330,160 L210,172" fill="none" stroke="#1e6fc0" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/></g><text x="300" y="196" font-size="10" text-anchor="middle" fill="currentColor">your thigh</text><g opacity="0.55"><path d="M330,128 L202,146" fill="none" stroke="#1e6fc0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="198" cy="147" r="9" fill="#1e6fc0"/></g><text x="300" y="118" font-size="10" text-anchor="middle" fill="#1e6fc0">forearm</text><g opacity="0.38"><circle cx="206" cy="128" r="12" fill="currentColor"/><path d="M222,124 L262,118" fill="none" stroke="currentColor" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M262,118 L292,112" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></g>
<path d="M240,62 L240,106 M248,62 L248,106" fill="none" stroke="#1e6fc0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>
<line x1="226" y1="66" x2="226.0" y2="97.0" stroke="#c62828" stroke-width="2.2" stroke-linecap="round"/><path d="M226,104 L229.5,97.0 L222.5,97.0 Z" fill="#c62828" stroke="none"/>
<text x="188" y="220" font-size="11.5" font-weight="bold" fill="currentColor">5 chest thrusts,</text>
<text x="188" y="234" font-size="11.5" fill="currentColor">2 fingers, centre of</text>
<text x="188" y="248" font-size="11.5" fill="currentColor">chest, just below the</text>
<text x="188" y="262" font-size="11.5" fill="currentColor">nipple line.</text>
<rect x="6" y="288" width="348" height="52" rx="5" fill="#c62828" fill-opacity="0.06" stroke="#c62828" stroke-width="1.6"/>
<text x="14" y="306.0" font-size="11" font-weight="bold" fill="#c62828">Repeat 5 and 5. NEVER abdominal thrusts under 1.</text>
<text x="14" y="319.5" font-size="11" font-weight="bold" fill="#c62828">Never hold an infant upside down by the feet.</text>
<text x="14" y="333.0" font-size="11" fill="#c62828">Remove only what you can see. Limp: start CPR.</text>
<text x="354" y="356" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
