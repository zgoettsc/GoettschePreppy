<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 418" width="360" height="418" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-device-fallback-ladder" aria-label="Pump and sensor fallback ladder">
<title>Pump and sensor fallback ladder</title>
<text x="6" y="18" font-size="11" font-style="italic" fill="currentColor">more convenience</text>
<line x1="14" y1="30" x2="14" y2="330" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="30" y1="30" x2="30" y2="330" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
<line x1="14" y1="50" x2="30" y2="50" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
<rect x="40" y="32" width="262" height="40" rx="5" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.4"/>
<text x="50" y="49" font-size="12.5" font-weight="bold" fill="currentColor">1. Full automation</text><text x="50" y="65" font-size="10.5" fill="currentColor">needs: pump + sensor + controller, power</text>
<line x1="14" y1="100" x2="30" y2="100" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
<rect x="40" y="82" width="262" height="40" rx="5" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.4"/>
<text x="50" y="99" font-size="12.5" font-weight="bold" fill="currentColor">2. Backup controller or reader</text><text x="50" y="115" font-size="10.5" fill="currentColor">needs: the spare, charged, already set up</text>
<line x1="14" y1="150" x2="30" y2="150" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
<rect x="40" y="132" width="262" height="40" rx="5" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.4"/>
<text x="50" y="149" font-size="12.5" font-weight="bold" fill="currentColor">3. Pump without automation</text><text x="50" y="165" font-size="10.5" fill="currentColor">needs: settings copy; sugar readings</text>
<line x1="14" y1="200" x2="30" y2="200" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
<rect x="40" y="182" width="262" height="40" rx="5" fill="#2e7d32" fill-opacity="0.08" stroke="#2e7d32" stroke-width="1.4"/>
<text x="50" y="199" font-size="12.5" font-weight="bold" fill="currentColor">4. Injections with a sensor</text><text x="50" y="215" font-size="10.5" fill="currentColor">needs: long- AND fast-acting; written plan</text>
<line x1="14" y1="250" x2="30" y2="250" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
<rect x="40" y="232" width="262" height="40" rx="5" fill="#2e7d32" fill-opacity="0.08" stroke="#2e7d32" stroke-width="1.4"/>
<text x="50" y="249" font-size="12.5" font-weight="bold" fill="currentColor">5. Injections, fingerstick meter</text><text x="50" y="265" font-size="10.5" fill="currentColor">needs: meter, many strips, night alarm</text>
<line x1="14" y1="300" x2="30" y2="300" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
<rect x="40" y="282" width="262" height="40" rx="5" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.4"/>
<text x="50" y="299" font-size="12.5" font-weight="bold" fill="currentColor">6. Fast-acting insulin only</text><text x="50" y="315" font-size="10.5" fill="currentColor">needs: frequent doses, prescriber&#x27;s plan only</text>
<text x="6" y="348" font-size="11" font-style="italic" fill="currentColor">more reliability</text>
<path d="M306,182 h8 v96 h-8" fill="none" stroke="#2e7d32" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="318" y="224.0" font-size="10.5" font-weight="bold" fill="#2e7d32">no</text>
<text x="318" y="236.5" font-size="10.5" font-weight="bold" fill="#2e7d32">power</text>
<text x="8" y="374" font-size="11.5" font-weight="bold" fill="currentColor">Never jump further down than the failure forces.</text>
<text x="8" y="389" font-size="11.5" font-weight="bold" fill="currentColor">Never stay above a rung that has stopped working.</text>
<text x="354" y="412" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
