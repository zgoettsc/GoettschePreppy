<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 308" width="360" height="308" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-vapour-flow" aria-label="Gasoline vapour flows along the floor">
<title>Gasoline vapour flows along the floor</title>
<text x="6" y="16" font-size="11.5" font-style="italic" fill="currentColor">Attached garage, cut away</text>
<rect x="6" y="26" width="300" height="184" fill="none" stroke="currentColor" stroke-width="2"/><line x1="6" y1="210" x2="354" y2="210" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
<rect x="306" y="26" width="48" height="184" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.2"/><text x="330" y="60" font-size="10.5" text-anchor="middle" fill="currentColor">house</text>
<rect x="300" y="120" width="12" height="90" fill="white" stroke="currentColor" stroke-width="1.4"/><text x="296" y="114" font-size="9.5" text-anchor="end" fill="currentColor">door</text>
<rect x="24" y="170" width="32" height="40" rx="4" fill="#c62828" fill-opacity="0.35" stroke="#c62828" stroke-width="1.8"/><rect x="28" y="162" width="10" height="8" rx="1" fill="#c62828" fill-opacity="0.5" stroke="#c62828" stroke-width="1.2"/><text x="40" y="156" font-size="9.5" text-anchor="middle" font-weight="bold" fill="#c62828">gasoline</text>
<path d="M90,198 L90,170 L114,144 L184,144 L208,170 L226,174 L226,198 Z" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="118" cy="200" r="11" fill="white" stroke="currentColor" stroke-width="1.8"/><circle cx="200" cy="200" r="11" fill="white" stroke="currentColor" stroke-width="1.8"/>
<rect x="246" y="70" width="46" height="140" rx="6" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.8"/><text x="269" y="110" font-size="10" text-anchor="middle" fill="currentColor">water</text><text x="269" y="122" font-size="10" text-anchor="middle" fill="currentColor">heater</text>
<path d="M269,204 c-5.6,-2.0999999999999996 -6.3,-8.399999999999999 -2.0999999999999996,-14.0 c0,4.199999999999999 2.8,4.199999999999999 2.8,1.4 c2.8,4.199999999999999 4.199999999999999,10.5 -0.7,12.6 Z" fill="#d97a00" fill-opacity="0.35" stroke="#d97a00" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="269" y="184" font-size="9.5" text-anchor="middle" font-weight="bold" fill="#d97a00">pilot</text>
<path d="M56,180 Q70,192 90,196 Q170,206 260,200 L262,210 L56,210 Z" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="66" y1="206" x2="83.0" y2="206.0" stroke="#c62828" stroke-width="1.6" stroke-linecap="round"/><path d="M88,206 L83.0,203.5 L83.0,208.5 Z" fill="#c62828" stroke="none"/>
<line x1="150" y1="206" x2="167.0" y2="206.0" stroke="#c62828" stroke-width="1.6" stroke-linecap="round"/><path d="M172,206 L167.0,203.5 L167.0,208.5 Z" fill="#c62828" stroke="none"/>
<line x1="216" y1="206" x2="233.0" y2="206.0" stroke="#c62828" stroke-width="1.6" stroke-linecap="round"/><path d="M238,206 L233.0,203.5 L233.0,208.5 Z" fill="#c62828" stroke="none"/>
<text x="64" y="50" font-size="10.5" font-weight="bold" fill="#c62828">vapour is heavier than air:</text>
<text x="64" y="63" font-size="10.5" fill="#c62828">it flows along the floor</text>
<text x="64" y="76" font-size="10.5" fill="#c62828">to the pilot light</text>
<text x="8" y="236" font-size="11.5" font-weight="bold" fill="currentColor">Never pour or transfer fuel inside the garage,</text>
<text x="8" y="251" font-size="11.5" font-weight="bold" fill="currentColor">power on or off.</text>
<text x="8" y="266" font-size="11.5" fill="currentColor">A fuel-fired appliance that cannot light in an outage</text>
<text x="8" y="281" font-size="11.5" fill="currentColor">lights again the moment power returns.</text>
<text x="354" y="302" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
