<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 347" width="360" height="347" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-cpr-child" aria-label="Child CPR hand position">
<title>Child CPR hand position</title>
<line x1="0" y1="204" x2="360" y2="204" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
<g opacity="0.55"><circle cx="74.64" cy="94.56" r="12.0" fill="#1e6fc0"/><path d="M80.64,116.56 L114.64,162.56" fill="none" stroke="#1e6fc0" stroke-width="22.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M114.64,162.56 L118.64,208.56 L166.64,210.56" fill="none" stroke="#1e6fc0" stroke-width="15.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M80.64,116.56 L74.64,178.56" fill="none" stroke="#1e6fc0" stroke-width="9.0" stroke-linecap="round" stroke-linejoin="round"/></g>
<g opacity="0.32"><circle cx="40.08" cy="193.92" r="9.36" fill="currentColor"/><path d="M53.04,194.64 L116.39999999999999,194.64" fill="none" stroke="currentColor" stroke-width="18.72" stroke-linecap="round" stroke-linejoin="round"/><path d="M114.96,196.8 L171.12,198.24 L195.6,193.92" fill="none" stroke="currentColor" stroke-width="11.52" stroke-linecap="round" stroke-linejoin="round"/><path d="M58.8,199.68 L102.0,201.12" fill="none" stroke="currentColor" stroke-width="6.4799999999999995" stroke-linecap="round" stroke-linejoin="round"/></g>
<rect x="67.64" y="174.56" width="14" height="9" rx="4" fill="#1e6fc0" fill-opacity="0.5" stroke="#1e6fc0" stroke-width="1.4"/>
<line x1="50.64" y1="144.56" x2="50.6" y2="172.6" stroke="#c62828" stroke-width="2.4" stroke-linecap="round"/><path d="M50.64,180.56 L54.6,172.6 L46.6,172.6 Z" fill="#c62828" stroke="none"/>
<text x="8" y="136.56" font-size="11.5" font-weight="bold" fill="#c62828">about 2 in</text>
<text x="4" y="28" font-size="15" font-weight="bold" fill="currentColor">CHILD</text><text x="4" y="44" font-size="11" fill="currentColor">1 year to puberty</text>
<rect x="242" y="30" width="110" height="104" rx="6" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
<g opacity="0.32"><circle cx="286" cy="82" r="18" fill="currentColor"/><path d="M302,94 L348,104" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></g>
<path d="M270,70 q-8,8 -4,18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><line x1="272" y1="50" x2="266.2" y2="61.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M264,66 L268.5,62.6 L264.0,60.4 Z" fill="currentColor" stroke="none"/>
<path d="M278,104 l-10,12" fill="none" stroke="#1e6fc0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="296" y="128" font-size="10" text-anchor="middle" fill="currentColor">tilt head, lift chin</text>
<text x="8" y="232" font-size="12" font-weight="bold" fill="currentColor">Hands</text><text x="74" y="232" font-size="12" fill="currentColor">heel of 1 hand (2 for a bigger child)</text>
<text x="8" y="249" font-size="12" font-weight="bold" fill="currentColor">Depth</text><text x="74" y="249" font-size="12" fill="currentColor">about 2 in (a third of the chest)</text>
<text x="8" y="266" font-size="12" font-weight="bold" fill="currentColor">Rate</text><text x="74" y="266" font-size="12" fill="currentColor">100 to 120 a minute</text>
<text x="8" y="283" font-size="12" font-weight="bold" fill="currentColor">Rhythm</text><text x="74" y="283" font-size="12" fill="currentColor">30 : 2 alone; 15 : 2 with two rescuers</text>
<text x="8" y="300" font-size="12" font-weight="bold" fill="currentColor">Breaths</text><text x="74" y="300" font-size="12" fill="currentColor">pinch nose, seal mouth, 1 second</text>
<text x="8" y="323" font-size="11.5" font-weight="bold" fill="currentColor">Alone: about 2 minutes of CPR before going for help.</text>
<text x="354" y="341" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
