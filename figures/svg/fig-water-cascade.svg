<rect x="218" y="238" width="26" height="16" rx="2" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="1.4"/><text x="231" y="270" font-size="10" text-anchor="middle" font-weight="bold" fill="#2e7d32">non-food</text>
<text x="231" y="282" font-size="10" text-anchor="middle" font-weight="bold" fill="#2e7d32">plants</text>
<text x="250" y="214" font-size="11" text-anchor="middle" font-style="italic" fill="currentColor">or</text>
<line x1="4" y1="288" x2="356" y2="288" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
<text x="8" y="302" font-size="11.5" font-weight="bold" fill="currentColor">Each drop used two or three times.</text>
<text x="8" y="317" font-size="11.5" fill="currentColor">Greywater: use it the same day; on the soil, not the leaves.</text>
<text x="8" y="332" font-size="11.5" font-weight="bold" fill="currentColor">Never for drinking, cooking, washing food or hands,</text>
<text x="8" y="347" font-size="11.5" font-weight="bold" fill="currentColor">or on the edible parts of food plants.</text>
<text x="354" y="368" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
