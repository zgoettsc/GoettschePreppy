<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" width="360" height="490" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-pressure-points" aria-label="Where pressure sores form">
<title>Where pressure sores form</title>
<text x="6" y="18" font-size="12" font-weight="bold" fill="currentColor">On the back: turn every 1 to 2 hours</text>
<rect x="6" y="96" width="348" height="8" rx="2" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.2"/>
<g opacity="0.3"><circle cx="28" cy="82" r="13" fill="currentColor"/><path d="M46,82 L150,82" fill="none" stroke="currentColor" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M150,84 L240,82 L300,70 L330,70" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M56,90 L118,92" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>
<rect x="240" y="78" width="52" height="14" rx="6" fill="#1e6fc0" fill-opacity="0.3" stroke="#1e6fc0" stroke-width="1.4"/><text x="266" y="118" font-size="10" text-anchor="middle" fill="#1e6fc0">pillow under calves:</text><text x="266" y="130" font-size="10" text-anchor="middle" fill="#1e6fc0">heels float</text>
<circle cx="18" cy="92" r="5.5" fill="#c62828" fill-opacity="0.6" stroke="#c62828" stroke-width="1.4"/>
<circle cx="60" cy="93" r="5.5" fill="#c62828" fill-opacity="0.6" stroke="#c62828" stroke-width="1.4"/>
<circle cx="100" cy="94" r="5.5" fill="#c62828" fill-opacity="0.6" stroke="#c62828" stroke-width="1.4"/>
<circle cx="150" cy="93" r="5.5" fill="#c62828" fill-opacity="0.6" stroke="#c62828" stroke-width="1.4"/>
<circle cx="334" cy="78" r="5.5" fill="#c62828" fill-opacity="0.6" stroke="#c62828" stroke-width="1.4"/>
<text x="18" y="118" font-size="10" text-anchor="middle" fill="currentColor">head</text><text x="62" y="118" font-size="10" text-anchor="middle" fill="currentColor">shoulder</text><text x="62" y="130" font-size="10" text-anchor="middle" fill="currentColor">blades</text>
<text x="102" y="118" font-size="10" text-anchor="middle" fill="currentColor">elbow</text><text x="152" y="118" font-size="10" text-anchor="middle" fill="currentColor">tailbone</text><text x="334" y="66" font-size="10" text-anchor="middle" fill="currentColor">heel</text>
<line x1="4" y1="144" x2="356" y2="144" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
<text x="6" y="164" font-size="12" font-weight="bold" fill="currentColor">On the side</text>
<rect x="6" y="236" width="348" height="8" rx="2" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.2"/>
<g opacity="0.3"><circle cx="30" cy="220" r="15" fill="currentColor"/><path d="M48,218 L150,216" fill="none" stroke="currentColor" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/><path d="M150,220 L230,224 L320,226" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/></g>
<rect x="220" y="206" width="60" height="10" rx="5" fill="#1e6fc0" fill-opacity="0.3" stroke="#1e6fc0" stroke-width="1.4"/><text x="250" y="200" font-size="10" text-anchor="middle" fill="#1e6fc0">pillow between knees and ankles</text>
<circle cx="24" cy="232" r="5.5" fill="#c62828" fill-opacity="0.6" stroke="#c62828" stroke-width="1.4"/>
<circle cx="60" cy="232" r="5.5" fill="#c62828" fill-opacity="0.6" stroke="#c62828" stroke-width="1.4"/>
<circle cx="148" cy="232" r="5.5" fill="#c62828" fill-opacity="0.6" stroke="#c62828" stroke-width="1.4"/>
<circle cx="226" cy="232" r="5.5" fill="#c62828" fill-opacity="0.6" stroke="#c62828" stroke-width="1.4"/>
<circle cx="312" cy="232" r="5.5" fill="#c62828" fill-opacity="0.6" stroke="#c62828" stroke-width="1.4"/>
<text x="24" y="258" font-size="10" text-anchor="middle" fill="currentColor">ear</text><text x="60" y="258" font-size="10" text-anchor="middle" fill="currentColor">shoulder</text><text x="148" y="258" font-size="10" text-anchor="middle" fill="currentColor">hip</text>
<text x="226" y="258" font-size="10" text-anchor="middle" fill="currentColor">knee</text><text x="312" y="258" font-size="10" text-anchor="middle" fill="currentColor">ankle</text>
<line x1="4" y1="270" x2="356" y2="270" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
<text x="6" y="290" font-size="12" font-weight="bold" fill="currentColor">In a wheelchair</text>
<circle cx="124" cy="414" r="26" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M84,382 L142,382 M84,382 L78,324" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>
<g opacity="0.3"><circle cx="94" cy="308" r="12" fill="currentColor"/><path d="M90,324 L88,376" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M88,376 L138,376 L142,426" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></g>
<circle cx="78" cy="338" r="5.5" fill="#c62828" fill-opacity="0.6" stroke="#c62828" stroke-width="1.4"/><circle cx="84" cy="376" r="5.5" fill="#c62828" fill-opacity="0.6" stroke="#c62828" stroke-width="1.4"/>
<text x="70" y="336" font-size="10" text-anchor="end" fill="currentColor">shoulder</text><text x="70" y="348" font-size="10" text-anchor="end" fill="currentColor">blades</text><text x="74" y="380" font-size="10" text-anchor="end" fill="currentColor">tailbone</text>
<text x="184" y="320.0" font-size="11.5" font-weight="bold" fill="currentColor">Shift weight every</text>
<text x="184" y="334.5" font-size="11.5" font-weight="bold" fill="currentColor">15 to 20 minutes:</text>
<text x="184" y="349.0" font-size="11.5" fill="currentColor">lean forward, left, right,</text>
<text x="184" y="363.5" font-size="11.5" fill="currentColor">or have someone help.</text>
<text x="184" y="378.0" font-size="11.5" fill="currentColor"></text>
<text x="184" y="392.5" font-size="11.5" fill="currentColor">Foam or gel seat cushion.</text>
<text x="184" y="407.0" font-size="11.5" font-weight="bold" fill="currentColor">No donut cushions.</text>
<text x="184" y="421.5" font-size="11.5" font-weight="bold" fill="currentColor">No pillow under the knees.</text>
<text x="6" y="466" font-size="11" fill="currentColor">Check the skin every day. Never drag: lift or use a draw sheet.</text>
<text x="354" y="484" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
