<text x="50" y="27.5" font-size="9.5" font-weight="bold" fill="#2e7d32">(bailer): fits</text>
<path d="M236,58 L240,34 L268,34 L272,58 Z" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><line x1="245" y1="36" x2="263" y2="54" stroke="#c62828" stroke-width="2.4" stroke-linecap="round"/><line x1="245" y1="54" x2="263" y2="36" stroke="#c62828" stroke-width="2.4" stroke-linecap="round"/><text x="254" y="28" font-size="9.5" text-anchor="middle" fill="#c62828">ordinary</text>
