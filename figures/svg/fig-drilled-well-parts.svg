<text x="132" y="134" font-size="10.5" text-anchor="end" font-weight="bold" fill="currentColor">pitless adapter,</text><text x="132" y="148" font-size="10" text-anchor="end" fill="currentColor">below frost line</text>
<rect x="290" y="10" width="66" height="200" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.8"/><text x="323" y="26" font-size="10.5" text-anchor="middle" fill="currentColor">house</text>
