<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 462" width="360" height="462" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-drilled-well-parts" aria-label="Parts of a drilled well">
