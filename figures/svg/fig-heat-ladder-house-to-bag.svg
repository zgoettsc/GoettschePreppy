<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 386" width="360" height="386" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-heat-ladder-house-to-bag" aria-label="Smaller is warmer: house to bag">
<title>Smaller is warmer: house to bag</title>
<path d="M10,80 L180,14 L350,80" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="16" y="80" width="328" height="240" fill="none" stroke="currentColor" stroke-width="2.2"/>
<text x="26" y="100" font-size="12" font-weight="bold" fill="currentColor">1. House</text>
<rect x="40" y="112" width="280" height="196" rx="2" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="2"/><text x="52" y="132" font-size="12" font-weight="bold" fill="currentColor">2. One room (→ 08-01)</text>
<path d="M70,290 L180,150 L290,290 Z" fill="#d97a00" fill-opacity="0.12" stroke="#d97a00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="180" y="178" font-size="12" text-anchor="middle" font-weight="bold" fill="#d97a00">3. Tent</text>
<rect x="118" y="214" width="124" height="64" rx="26" fill="#1e6fc0" fill-opacity="0.15" stroke="#1e6fc0" stroke-width="2"/><text x="180" y="232" font-size="11" text-anchor="middle" font-weight="bold" fill="#1e6fc0">4. Sleeping bag</text>
<g opacity="0.35"><circle cx="140" cy="256" r="9" fill="currentColor"/><path d="M152,256 L220,258" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="186" y="274" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor">5. layers</text>
<text x="8" y="346" font-size="11.5" font-weight="bold" fill="currentColor">Each step: a smaller space, the same heat source: you.</text>
<text x="8" y="361" font-size="11.5" fill="currentColor">Step down as fuel gets short (→ 08-06).</text>
<text x="354" y="380" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
