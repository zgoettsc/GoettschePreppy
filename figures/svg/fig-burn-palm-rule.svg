<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 372" width="360" height="372" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-burn-palm-rule" aria-label="Sizing a burn with the palm rule">
<title>Sizing a burn with the palm rule</title>
<text x="6" y="18" font-weight="bold" fill="currentColor">THEIR OWN palm</text>
<g opacity="0.45"><path d="M68.1,196 L62.2,169.9 L57.9,123.5 L110.1,123.5 L107.2,164.1 L99.9,196 Z" fill="#d97a00" stroke="#d97a00" stroke-width="8.7" stroke-linejoin="round"/><path d="M63.7,129.3 L62.7,80.0" stroke="#d97a00" stroke-width="12.3" stroke-linecap="round" fill="none"/><path d="M77.5,129.3 L77.1,71.3" stroke="#d97a00" stroke-width="12.3" stroke-linecap="round" fill="none"/><path d="M91.2,129.3 L91.6,74.2" stroke="#d97a00" stroke-width="12.3" stroke-linecap="round" fill="none"/><path d="M104.3,129.3 L105.3,85.8" stroke="#d97a00" stroke-width="12.3" stroke-linecap="round" fill="none"/><path d="M107.2,169.9 L124.6,149.6 L133.3,129.3" stroke="#d97a00" stroke-width="13.0" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
<text x="6" y="222" font-size="11.5" font-weight="bold" fill="currentColor">palm ≈ 1% of their body</text>
<text x="6" y="236" font-size="11.5" fill="currentColor">palm + fingers ≈ 0.8 to 1%</text>
<line x1="178" y1="8" x2="178" y2="250" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
<text x="188" y="18" font-size="12" font-weight="bold" fill="currentColor">Measure a toddler with</text><text x="188" y="33" font-size="12" font-weight="bold" fill="currentColor">the toddler&#x27;s palm</text>
<g opacity="0.25"><path d="M219.4,196 L214.8,175.3 L211.3,138.5 L252.7,138.5 L250.4,170.7 L244.6,196 Z" fill="currentColor" stroke="currentColor" stroke-width="6.9" stroke-linejoin="round"/><path d="M215.9,143.1 L215.1,104.0" stroke="currentColor" stroke-width="9.8" stroke-linecap="round" fill="none"/><path d="M226.8,143.1 L226.6,97.1" stroke="currentColor" stroke-width="9.8" stroke-linecap="round" fill="none"/><path d="M237.8,143.1 L238.0,99.4" stroke="currentColor" stroke-width="9.8" stroke-linecap="round" fill="none"/><path d="M248.1,143.1 L248.9,108.6" stroke="currentColor" stroke-width="9.8" stroke-linecap="round" fill="none"/><path d="M250.4,175.3 L264.2,159.2 L271.1,143.1" stroke="currentColor" stroke-width="10.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
<line x1="206" y1="98" x2="258" y2="158" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><line x1="206" y1="158" x2="258" y2="98" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
<text x="232" y="214" font-size="10.5" text-anchor="middle" fill="#c62828">adult</text>
<g opacity="0.5"><path d="M305.2,196 L302.7,184.8 L300.8,165.0 L323.2,165.0 L321.9,182.4 L318.8,196 Z" fill="#d97a00" stroke="#d97a00" stroke-width="3.7" stroke-linejoin="round"/><path d="M303.3,167.5 L302.9,146.4" stroke="#d97a00" stroke-width="5.3" stroke-linecap="round" fill="none"/><path d="M309.2,167.5 L309.1,142.7" stroke="#d97a00" stroke-width="5.3" stroke-linecap="round" fill="none"/><path d="M315.1,167.5 L315.3,143.9" stroke="#d97a00" stroke-width="5.3" stroke-linecap="round" fill="none"/><path d="M320.7,167.5 L321.1,148.9" stroke="#d97a00" stroke-width="5.3" stroke-linecap="round" fill="none"/><path d="M321.9,184.8 L329.4,176.2 L333.1,167.5" stroke="#d97a00" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
<path d="M302,128.8 L308.08,136 L318,120" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="312" y="214" font-size="10.5" text-anchor="middle" fill="#2e7d32">toddler</text>
<line x1="4" y1="256" x2="356" y2="256" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
<text x="8" y="278.0" font-size="11.5" font-weight="bold" fill="currentColor">Count blistered or worse. Redness alone does not count.</text>
<text x="8" y="293.5" font-size="11.5" fill="currentColor">Adult: about 10 of their own palms or more (10%)</text>
<text x="8" y="309.0" font-size="11.5" fill="currentColor">   → move toward whatever care exists (→ 12-03).</text>
<text x="8" y="324.5" font-size="11.5" fill="currentColor">Child: a burn bigger than a few of their own palms</text>
<text x="8" y="340.0" font-size="11.5" fill="currentColor">   is serious. Any burn on an infant counts.</text>
<text x="354" y="366" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
