<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 476" width="360" height="476" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-stroke-fast" aria-label="F.A.S.T. stroke check">
<title>F.A.S.T. stroke check</title>
<rect x="4" y="4" width="352" height="50" rx="6" fill="#d97a00" fill-opacity="0.14" stroke="#d97a00" stroke-width="1.8"/>
<text x="14" y="24" font-size="11.5" font-weight="bold" fill="currentColor">FIRST, if they have diabetes and a meter or sensor:</text>
<text x="14" y="39" font-size="11.5" fill="currentColor">check blood sugar. A low looks exactly like a stroke.</text>
<rect x="4" y="66" width="174" height="156" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text x="14" y="96" font-size="28" font-weight="bold" fill="#c62828">F</text><text x="40" y="92" font-size="12.5" font-weight="bold" fill="currentColor">Face drooping</text>
<circle cx="116" cy="140" r="26" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.8"/><circle cx="107" cy="133" r="2.5" fill="currentColor" stroke="currentColor" stroke-width="1.6"/><circle cx="125" cy="135" r="2.5" fill="currentColor" stroke="currentColor" stroke-width="1.6"/>
<path d="M104,148 Q114,154 120,153 Q126,154 129,159" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="148" y1="146" x2="148.0" y2="154.0" stroke="#c62828" stroke-width="1.8" stroke-linecap="round"/><path d="M148,160 L151.0,154.0 L145.0,154.0 Z" fill="#c62828" stroke="none"/>
<text x="14" y="184" font-size="11" fill="currentColor">Ask for a smile:</text>
<text x="14" y="197" font-size="11" fill="currentColor">one side sags.</text>
<rect x="182" y="66" width="174" height="156" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text x="192" y="96" font-size="28" font-weight="bold" fill="#c62828">A</text><text x="218" y="92" font-size="12.5" font-weight="bold" fill="currentColor">Arm weakness</text>
<g opacity="0.35"><circle cx="294" cy="116" r="9" fill="currentColor"/><path d="M294,128 L294,166" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M289,132 L268,106" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M299,132 L324,142" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<path d="M328,110 A40,40 0 0 1 332,136" fill="none" stroke="#c62828" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><line x1="332" y1="130" x2="331.7" y2="132.0" stroke="#c62828" stroke-width="1.8" stroke-linecap="round"/><path d="M331,138 L334.7,132.4 L328.8,131.7 Z" fill="#c62828" stroke="none"/>
<text x="192" y="184" font-size="11" fill="currentColor">Raise both arms:</text>
<text x="192" y="197" font-size="11" fill="currentColor">one drifts down.</text>
<rect x="4" y="230" width="174" height="156" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text x="14" y="260" font-size="28" font-weight="bold" fill="#c62828">S</text><text x="40" y="256" font-size="12.5" font-weight="bold" fill="currentColor">Speech difficulty</text>
<path d="M82,282 h66 a6,6 0 0 1 6,6 v26 a6,6 0 0 1 -6,6 h-40 l-12,12 v-12 h-14 a6,6 0 0 1 -6,-6 v-26 a6,6 0 0 1 6,-6 Z" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="120" y="304" font-size="11" text-anchor="middle" font-style="italic" fill="currentColor">wh..t? ma</text><text x="120" y="317" font-size="11" text-anchor="middle" font-style="italic" fill="currentColor">tt..er</text>
<text x="14" y="348" font-size="11" fill="currentColor">Slurred, wrong words,</text>
<text x="14" y="361" font-size="11" fill="currentColor">cannot repeat a</text>
<text x="14" y="374" font-size="11" fill="currentColor">simple sentence.</text>
<rect x="182" y="230" width="174" height="156" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text x="192" y="260" font-size="28" font-weight="bold" fill="#c62828">T</text><text x="218" y="256" font-size="12.5" font-weight="bold" fill="currentColor">Time</text>
<circle cx="294" cy="302" r="24" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.8"/><line x1="294" y1="302" x2="294" y2="286" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><line x1="294" y1="302" x2="306" y2="308" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<text x="192" y="348" font-size="11" fill="currentColor">Note the time it</text>
<text x="192" y="361" font-size="11" fill="currentColor">started. Call 911</text>
<text x="192" y="374" font-size="11" fill="currentColor">or go now.</text>
<rect x="4" y="404" width="352" height="46" rx="5" fill="#c62828" fill-opacity="0.06" stroke="#c62828" stroke-width="1.6"/>
<text x="14" y="422" font-size="12" font-weight="bold" fill="#c62828">Any ONE sign means act. Sudden and one-sided.</text>
<text x="14" y="437" font-size="12" font-weight="bold" fill="#c62828">No aspirin for a possible stroke.</text>
<text x="354" y="470" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
