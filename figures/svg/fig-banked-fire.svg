<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 306" width="360" height="306" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-banked-fire" aria-label="Banking a fire overnight">
<title>Banking a fire overnight</title>
<text x="6" y="18" font-size="11.5" font-style="italic" fill="currentColor">Side section</text>
<line x1="0" y1="170" x2="360" y2="170" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="0" y="170" width="360" height="10" fill="currentColor" fill-opacity="0.12" stroke="none"/>
<path d="M90,170 Q180,80 270,170 Z" fill="#c62828" fill-opacity="0.35" stroke="#c62828" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="150" cy="150" r="6" fill="#d97a00" fill-opacity="0.8" stroke="#d97a00" stroke-width="0"/>
<circle cx="180" cy="136" r="6" fill="#d97a00" fill-opacity="0.8" stroke="#d97a00" stroke-width="0"/>
<circle cx="210" cy="148" r="6" fill="#d97a00" fill-opacity="0.8" stroke="#d97a00" stroke-width="0"/>
<circle cx="166" cy="160" r="6" fill="#d97a00" fill-opacity="0.8" stroke="#d97a00" stroke-width="0"/>
<circle cx="196" cy="158" r="6" fill="#d97a00" fill-opacity="0.8" stroke="#d97a00" stroke-width="0"/>
<text x="180" y="166" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor">compact coal mound</text>
<path d="M60,170 Q100,140 130,126 L140,136 Q110,152 96,170 Z" fill="currentColor" fill-opacity="0.35" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300,170 Q260,140 230,126 L220,136 Q250,152 264,170 Z" fill="currentColor" fill-opacity="0.35" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="156" cy="106" rx="40" ry="15" fill="#d97a00" fill-opacity="0.5" stroke="currentColor" stroke-width="1.8"/>
<ellipse cx="206" cy="110" rx="40" ry="15" fill="#d97a00" fill-opacity="0.5" stroke="currentColor" stroke-width="1.8"/>
<text x="180" y="78" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor">1 or 2 large, dense logs on top</text>
<text x="4" y="100.0" font-size="10.5" font-weight="bold" fill="currentColor">ash over</text>
<text x="4" y="112.5" font-size="10.5" font-weight="bold" fill="currentColor">the edges</text><line x1="46" y1="118" x2="81.8" y2="141.3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M86,144 L83.2,139.2 L80.4,143.4 Z" fill="currentColor" stroke="none"/>
<text x="8" y="204" font-size="11.5" fill="currentColor">1. Burn down to a good bed of coals.</text>
<text x="8" y="219" font-size="11.5" fill="currentColor">2. Rake the coals into a compact pile.</text>
<text x="8" y="234" font-size="11.5" fill="currentColor">3. One or two large, dense logs on top.</text>
<text x="8" y="249" font-size="11.5" fill="currentColor">4. Cover the edges with ash.</text>
<text x="8" y="264" font-size="11.5" fill="currentColor">5. Morning: rake off the ash, fine kindling, blow gently.</text>
<text x="8" y="286" font-size="11" font-weight="bold" fill="currentColor">Indoors: bank with dry wood; smouldering makes creosote.</text>
<text x="354" y="300" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
