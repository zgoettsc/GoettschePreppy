<text x="159" y="420" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#c62828">MAIN OFF</text>
<text x="8" y="455" font-size="11" fill="#2e7d32">The main breaker is off whenever the generator feeds the panel:</text>
<text x="8" y="469" font-size="11" fill="#2e7d32">nothing reaches the meter or the street.</text>
<text x="8" y="490" font-size="11" fill="currentColor">TS = transfer switch beside the panel, or an interlock plate on</text>
<text x="8" y="504" font-size="11" fill="currentColor">the panel. Both installed by a licensed electrician.</text>
