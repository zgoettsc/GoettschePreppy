<text x="8" y="219" font-size="11" fill="#c62828">It flows out through the meter to the pole transformer, which raises</text>
<text x="8" y="233" font-size="11" fill="#c62828">it to the street line&#x27;s voltage. The worker believes the line is dead.</text>
