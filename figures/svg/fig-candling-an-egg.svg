<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 308" width="360" height="308" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-candling-an-egg" aria-label="Candling an egg">
<title>Candling an egg</title>
<rect x="0" y="0" width="360" height="200" fill="#333" fill-opacity="1" stroke="none"/>
<text x="8" y="18" font-size="11.5" font-weight="bold" fill="white">Dark room</text>
<rect x="40" y="150" width="24" height="44" rx="4" fill="#888" fill-opacity="1" stroke="currentColor" stroke-width="1.6"/><path d="M34,150 L70,150 L64,136 L40,136 Z" fill="#ddd" fill-opacity="1" stroke="#ddd" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="52" cy="92" rx="26" ry="36" fill="#d97a00" fill-opacity="0.18" stroke="currentColor" stroke-width="1.8"/><path d="M35.879999999999995,65.6 Q52,71.6 68.12,65.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="52" cy="98" r="14" fill="#d97a00" fill-opacity="0.35" stroke="#d97a00" stroke-width="0"/>
<path d="M40,136 L28,70 M64,136 L76,70" fill="none" stroke="#ffd36b" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 3"/>
<text x="6" y="214" font-size="10.5" fill="currentColor">egg held on a bright flashlight</text>
<text x="170" y="30" font-size="12" text-anchor="middle" font-weight="bold" fill="#9be29f">SOUND</text>
<ellipse cx="170" cy="104" rx="34" ry="46" fill="#d97a00" fill-opacity="0.18" stroke="currentColor" stroke-width="1.8"/><path d="M148.92000000000002,67.6 Q170,73.6 191.07999999999998,67.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="170" cy="110" r="14" fill="#d97a00" fill-opacity="0.35" stroke="#d97a00" stroke-width="0"/>
<text x="290" y="30" font-size="12" text-anchor="middle" font-weight="bold" fill="#ff8a80">BAD</text>
<ellipse cx="290" cy="104" rx="34" ry="46" fill="#d97a00" fill-opacity="0.18" stroke="currentColor" stroke-width="1.8"/><path d="M268.92,86.8 Q290,104.80000000000001 311.08,86.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M278,108 q8,-12 18,-4 q10,8 0,18 q-12,10 -20,0 Z" fill="currentColor" fill-opacity="0.6" stroke="currentColor" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="304" cy="126" r="4" fill="currentColor" fill-opacity="0.5" stroke="currentColor" stroke-width="0"/><circle cx="274" cy="130" r="3" fill="currentColor" fill-opacity="0.5" stroke="currentColor" stroke-width="0"/>
<text x="170" y="176" font-size="10" text-anchor="middle" fill="white">small air pocket,</text><text x="170" y="189" font-size="10" text-anchor="middle" fill="white">faint yolk shadow</text>
<text x="290" y="176" font-size="10" text-anchor="middle" fill="white">large air pocket,</text><text x="290" y="189" font-size="10" text-anchor="middle" fill="white">dark mass, blotches</text>
<text x="8" y="238" font-size="11.5" font-weight="bold" fill="currentColor">Large air pocket, dark or moving mass, blotches,</text>
<text x="8" y="253" font-size="11.5" font-weight="bold" fill="currentColor">cracks, or a bad smell: throw it out.</text>
<text x="8" y="268" font-size="11.5" fill="currentColor">Float test: one that floats is old: throw it out.</text>
<text x="8" y="283" font-size="11.5" fill="currentColor">Crack each egg into a separate bowl first.</text>
<text x="354" y="302" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
