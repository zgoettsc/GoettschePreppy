<text x="42" y="170" font-size="11.5" text-anchor="middle" font-weight="bold" fill="currentColor">1. Tinder</text><text x="42" y="184" font-size="9" text-anchor="middle" fill="currentColor">catches a spark</text>
<text x="120" y="170" font-size="11.5" text-anchor="middle" font-weight="bold" fill="currentColor">2. Kindling</text><text x="120" y="184" font-size="9" text-anchor="middle" fill="currentColor">pencil-lead to pencil</text>
<text x="214" y="170" font-size="11.5" text-anchor="middle" font-weight="bold" fill="currentColor">3. Small fuel</text><text x="214" y="184" font-size="9" text-anchor="middle" fill="currentColor">finger to wrist</text>
<text x="308" y="170" font-size="11.5" text-anchor="middle" font-weight="bold" fill="currentColor">4. Fuel wood</text><text x="308" y="184" font-size="9" text-anchor="middle" fill="currentColor">the real logs</text>
<text x="120" y="202" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#c62828">× 3 what you think</text>
<text x="8" y="232.0" font-size="11" fill="currentColor">Tinder: petroleum-jelly cotton ball, birch bark, dryer lint,</text>
<text x="8" y="246.5" font-size="11" fill="currentColor">fatwood shavings, char cloth, a commercial starter.</text>
<text x="8" y="261.0" font-size="11" font-weight="bold" fill="currentColor">Running back for more kindling while a weak flame dies</text>
<text x="8" y="275.5" font-size="11" font-weight="bold" fill="currentColor">is the most common failure.</text>
<text x="354" y="292" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
