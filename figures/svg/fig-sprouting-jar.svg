<text x="150" y="70" font-size="10.5" font-weight="bold" fill="currentColor">tilted mouth-DOWN</text><text x="150" y="83" font-size="10.5" fill="currentColor">mesh lid</text><text x="150" y="96" font-size="10.5" fill="currentColor">drains into a bowl</text>
<text x="20" y="230" font-size="10.5" fill="currentColor">room temperature, out of direct sun</text>
<line x1="4" y1="244" x2="356" y2="244" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
<text x="6" y="264" font-size="12" font-weight="bold" fill="currentColor">Rinse and drain twice a day:</text>
<ellipse cx="40" cy="300" rx="12" ry="8" fill="#d97a00" fill-opacity="0.45" stroke="currentColor" stroke-width="1.4"/>
<text x="46" y="330" font-size="10.5" text-anchor="middle" fill="currentColor">soaked</text>
<ellipse cx="124" cy="300" rx="12" ry="8" fill="#d97a00" fill-opacity="0.45" stroke="currentColor" stroke-width="1.4"/>
<path d="M134,302 q3.5999999999999996,4 6,-2" fill="none" stroke="#2e7d32" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="130" y="330" font-size="10.5" text-anchor="middle" fill="currentColor">day 1</text>
<ellipse cx="208" cy="300" rx="12" ry="8" fill="#d97a00" fill-opacity="0.45" stroke="currentColor" stroke-width="1.4"/>
<path d="M218,302 q8.4,4 14,-2" fill="none" stroke="#2e7d32" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="214" y="330" font-size="10.5" text-anchor="middle" fill="currentColor">day 2-3</text>
<ellipse cx="292" cy="300" rx="12" ry="8" fill="#d97a00" fill-opacity="0.45" stroke="currentColor" stroke-width="1.4"/>
<path d="M302,302 q15.6,4 26,-2" fill="none" stroke="#2e7d32" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="298" y="330" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#2e7d32">READY</text>
<text x="292" y="346" font-size="9.5" text-anchor="middle" fill="currentColor">sprout about as long as the seed</text>
<text x="8" y="372" font-size="11.5" fill="currentColor">Ready in 2 to 6 days. Keep finished sprouts cold.</text>
<text x="8" y="387" font-size="11.5" font-weight="bold" fill="currentColor">Musty, sour, slimy or mouldy: throw the batch out.</text>
<text x="354" y="406" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
