<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 412" width="360" height="412" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-sprouting-jar" aria-label="Sprouting in a jar">
<title>Sprouting in a jar</title>
<path d="M20,170 Q90,220 160,170 Z" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
