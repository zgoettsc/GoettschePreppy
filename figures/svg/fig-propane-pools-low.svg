<text x="8" y="246" font-size="11.5" font-weight="bold" fill="currentColor">Propane is heavier than air: it spreads along the floor.</text>
<text x="8" y="261" font-size="11.5" fill="currentColor">The heater lit in the morning, or a pilot across the room,</text>
<text x="8" y="276" font-size="11.5" fill="currentColor">catches the edge of the cloud: flash fire or explosion.</text>
<text x="8" y="291" font-size="11.5" fill="currentColor">Never in a basement.</text>
