<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" width="360" height="296" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-chainsaw-kickback-zone" aria-label="Chainsaw kickback zone">
<title>Chainsaw kickback zone</title>
<rect x="20" y="110" width="90" height="60" rx="10" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="1.8"/><text x="65" y="144" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor">saw</text>
<path d="M10,140 q-8,-30 20,-40 l10,10 q-18,6 -14,30" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/><text x="4" y="186" font-size="10" fill="currentColor">rear handle:</text><text x="4" y="198" font-size="10" font-weight="bold" fill="currentColor">RIGHT hand</text>
<path d="M60,110 q10,-34 50,-30" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/><text x="116" y="98" font-size="10" font-weight="bold" fill="currentColor">front handle: LEFT hand</text>
<path d="M110,126 L320,132 A16,16 0 0 1 320,164 L110,160 Z" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M320,132 A16,16 0 0 1 336,148 L320,148 Z" fill="#c62828" fill-opacity="0.6" stroke="#c62828" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="342" y="122" font-size="11" text-anchor="end" font-weight="bold" fill="#c62828">KICKBACK</text><text x="326" y="128" font-size="1" fill="currentColor"></text>
<text x="314" y="190" font-size="10" text-anchor="middle" font-weight="bold" fill="#c62828">upper tip of the bar</text>
<path d="M300,110 Q200,-20 60,50" fill="none" stroke="#c62828" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="80" y1="48" x2="68.0" y2="49.2" stroke="#c62828" stroke-width="2.2" stroke-linecap="round"/><path d="M60,50 L68.4,53.2 L67.6,45.2 Z" fill="#c62828" stroke="none"/>
<text x="170" y="72" font-size="11" text-anchor="middle" font-weight="bold" fill="#c62828">bar thrown UP and BACK</text>
<text x="8" y="226.0" font-size="11" font-weight="bold" fill="currentColor">Never let the nose of the bar touch anything.</text>
<text x="8" y="240.5" font-size="11" fill="currentColor">Never cut above shoulder height; never on a ladder.</text>
<text x="8" y="255.0" font-size="11" fill="currentColor">Chain brake on whenever you walk with the saw.</text>
<text x="8" y="269.5" font-size="11" fill="currentColor">Chaps, helmet with face shield and muffs, glasses, gloves.</text>
<text x="354" y="290" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
