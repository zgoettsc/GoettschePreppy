<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 391" width="360" height="391" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-auto-injector-outer-thigh" aria-label="Where an epinephrine auto-injector goes">
<title>Where an epinephrine auto-injector goes</title>
<text x="6" y="18" font-size="11.5" font-style="italic" fill="currentColor">Front view, hips to knees</text>
<path d="M60,40 L176,40 L172,96 L162,236 L124,236 L118,120 L112,236 L74,236 L64,96 Z" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="118" y1="52" x2="118" y2="120" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
<text x="92" y="254" font-size="10" text-anchor="middle" fill="currentColor">left</text><text x="146" y="254" font-size="10" text-anchor="middle" fill="currentColor">right</text>
<ellipse cx="164" cy="140" rx="9" ry="26" fill="#d97a00" fill-opacity="0.45" stroke="#d97a00" stroke-width="1.6"/>
<rect x="176" y="132" width="62" height="16" rx="5" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.8"/><rect x="238" y="134" width="14" height="12" rx="3" fill="currentColor" fill-opacity="0.3" stroke="currentColor" stroke-width="1.4"/>
<rect x="170" y="135" width="8" height="10" rx="2" fill="#d97a00" fill-opacity="0.8" stroke="#d97a00" stroke-width="1.4"/>
<line x1="268" y1="140" x2="261.0" y2="140.0" stroke="#c62828" stroke-width="2.4" stroke-linecap="round"/><path d="M254,140 L261.0,143.5 L261.0,136.5 Z" fill="#c62828" stroke="none"/>
<text x="212" y="124" font-size="10.5" text-anchor="middle" fill="currentColor">pen</text>
<text x="176" y="176" font-size="11.5" font-weight="bold" fill="currentColor">OUTER thigh,</text>
<text x="176" y="190" font-size="11.5" fill="currentColor">middle of the thigh</text>
<text x="176" y="204" font-size="11.5" fill="currentColor">through clothing if needed</text>
<line x1="4" y1="270" x2="356" y2="270" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
<text x="10" y="290" font-size="12.5" font-weight="bold" fill="#d97a00">1</text><text x="28" y="290" font-size="12" fill="currentColor">Follow your own device&#x27;s instructions.</text>
<text x="10" y="307" font-size="12.5" font-weight="bold" fill="#d97a00">2</text><text x="28" y="307" font-size="12" fill="currentColor">One common pen (FDA label): hold it in place</text>
<text x="28" y="324" font-size="12" fill="currentColor">3 seconds (count 1, 2, 3), then massage 10 s.</text>
<text x="10" y="341" font-size="12.5" font-weight="bold" fill="#d97a00">3</text><text x="28" y="341" font-size="12" fill="currentColor">Note the time. Say it aloud or write it.</text>
<text x="10" y="358" font-size="12.5" font-weight="bold" fill="#d97a00">4</text><text x="28" y="358" font-size="12" fill="currentColor">Lie them down (→ figure: positions).</text>
<text x="354" y="385" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
