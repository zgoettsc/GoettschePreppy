<text x="180" y="246" text-anchor="middle" font-weight="bold" fill="#c62828">Insulin NEVER touches ice.</text>
<text x="8" y="278" font-size="11.5" fill="currentColor">Aim for the label&#x27;s 36 to 46 °F. Read the min/max often.</text>
