<circle cx="277" cy="242" r="16" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="277" y1="242" x2="288" y2="231" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<circle cx="252" cy="282" r="5" fill="currentColor" fill-opacity="0.8" stroke="currentColor" stroke-width="1.2"/><text x="252" y="272" font-size="9" text-anchor="middle" fill="currentColor">COM</text>
