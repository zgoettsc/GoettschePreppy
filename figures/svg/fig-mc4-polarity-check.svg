<path d="M14,175.7 L19.32,182 L28,168" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="34" y="180" font-size="12" font-weight="bold" fill="#2e7d32">No minus sign:</text>
<text x="34" y="195" font-size="12" fill="#2e7d32">polarity correct.</text>
<rect x="14" y="222" width="98" height="34" rx="3" fill="none" stroke="#c62828" stroke-width="1.6"/><text x="63" y="246" font-size="19" text-anchor="middle" font-weight="bold" fill="#c62828">−61.3</text>
<text x="14" y="274" font-size="12" font-weight="bold" fill="#c62828">Minus sign: a connector</text>
<text x="14" y="289" font-size="12" font-weight="bold" fill="#c62828">is reversed. Swap it</text>
<text x="14" y="304" font-size="12" font-weight="bold" fill="#c62828">before plugging in.</text>
<text x="8" y="334" font-size="11" font-style="italic" fill="currentColor">Numbers are an example: read your own string.</text>
