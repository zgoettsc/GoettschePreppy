<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-evaporative-pouch" aria-label="Using an evaporative cooling pouch">
<title>Using an evaporative cooling pouch</title>
<rect x="4" y="6" width="85" height="150" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6"/><text x="46" y="24" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor">1. SOAK, timed</text>
<rect x="93" y="6" width="85" height="150" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6"/><text x="135" y="24" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor">2. Drain, towel</text>
<rect x="182" y="6" width="85" height="150" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6"/><text x="224" y="24" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor">3. Medicine in</text>
<rect x="271" y="6" width="85" height="150" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6"/><text x="313" y="24" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor">4. OPEN to air</text>
<path d="M12,80 h70 q-4,40 -35,40 q-31,0 -35,-40 Z" fill="#1e6fc0" fill-opacity="0.15" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><rect x="20" y="72" width="54" height="26" rx="6" fill="#1e6fc0" fill-opacity="0.25" stroke="#1e6fc0" stroke-width="1.6"/><path d="M26,80 h42 M26,89 h42 M26,98 h42" fill="none" stroke="#1e6fc0" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>
<circle cx="66" cy="50" r="9" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="66" y1="50" x2="66" y2="44" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="66" y1="50" x2="70" y2="52" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
<text x="46" y="140.0" font-size="9.5" text-anchor="middle" fill="currentColor">your leaflet&#x27;s</text>
<text x="46" y="151.5" font-size="9.5" text-anchor="middle" fill="currentColor">exact time</text>
<rect x="110" y="70" width="56" height="34" rx="6" fill="#1e6fc0" fill-opacity="0.25" stroke="#1e6fc0" stroke-width="1.6"/><path d="M116,78 h44 M116,87 h44 M116,96 h44" fill="none" stroke="#1e6fc0" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/><path d="M104,100 q30,-24 66,0 l0,12 q-34,-20 -66,0 Z" fill="#d97a00" fill-opacity="0.35" stroke="#d97a00" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="136" y="140.0" font-size="9.5" text-anchor="middle" fill="currentColor">semi-dry,</text>
<text x="136" y="151.5" font-size="9.5" text-anchor="middle" fill="currentColor">not dripping</text>
<rect x="198" y="82" width="56" height="34" rx="6" fill="#1e6fc0" fill-opacity="0.25" stroke="#1e6fc0" stroke-width="1.6"/><path d="M204,90 h44 M204,99 h44 M204,108 h44" fill="none" stroke="#1e6fc0" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/><rect x="214" y="46" width="12" height="50" rx="4" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.4"/><line x1="240" y1="50" x2="240.0" y2="71.0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M240,76 L242.5,71.0 L237.5,71.0 Z" fill="currentColor" stroke="none"/>
<text x="226" y="140.0" font-size="9.5" text-anchor="middle" fill="currentColor">in its own</text>
<text x="226" y="151.5" font-size="9.5" text-anchor="middle" fill="currentColor">packaging</text>
<rect x="270" y="104" width="82" height="10" rx="2" fill="currentColor" fill-opacity="0.3" stroke="currentColor" stroke-width="1.2"/><rect x="282" y="74" width="56" height="34" rx="6" fill="#1e6fc0" fill-opacity="0.25" stroke="#1e6fc0" stroke-width="1.6"/><path d="M288,82 h44 M288,91 h44 M288,100 h44" fill="none" stroke="#1e6fc0" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>
<path d="M290,68 q-4,-6 0,-12 q4,-6 0,-12" fill="none" stroke="#1e6fc0" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M306,68 q-4,-6 0,-12 q4,-6 0,-12" fill="none" stroke="#1e6fc0" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M322,68 q-4,-6 0,-12 q4,-6 0,-12" fill="none" stroke="#1e6fc0" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="312" y="132.0" font-size="9.5" text-anchor="middle" fill="currentColor">belt, pocket,</text>
<text x="312" y="143.5" font-size="9.5" text-anchor="middle" fill="currentColor">open bag</text>
<text x="6" y="182" font-size="12.5" font-weight="bold" fill="#c62828">Stops the cooling completely:</text>
<rect x="14" y="196" width="120" height="64" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.6"/><line x1="14" y1="206" x2="134" y2="206" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="40" y="216" width="56" height="34" rx="6" fill="#1e6fc0" fill-opacity="0.25" stroke="#1e6fc0" stroke-width="1.6"/><path d="M46,224 h44 M46,233 h44 M46,242 h44" fill="none" stroke="#1e6fc0" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>
<line x1="14" y1="196" x2="134" y2="260" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><line x1="14" y1="260" x2="134" y2="196" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><text x="74" y="278" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#c62828">sealed in a zip bag</text>
<rect x="176" y="196" width="120" height="64" rx="2" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2.4"/><rect x="208" y="214" width="56" height="34" rx="6" fill="#1e6fc0" fill-opacity="0.25" stroke="#1e6fc0" stroke-width="1.6"/><path d="M214,222 h44 M214,231 h44 M214,240 h44" fill="none" stroke="#1e6fc0" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>
<line x1="176" y1="196" x2="296" y2="260" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><line x1="176" y1="260" x2="296" y2="196" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><text x="236" y="278" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#c62828">airtight or waterproof box</text>
<text x="8" y="304" font-size="11.5" font-weight="bold" fill="currentColor">Not a refrigerator. No protection against freezing.</text>
<text x="8" y="319" font-size="11.5" fill="currentColor">Re-soak on your product&#x27;s schedule; check it with a</text>
<text x="8" y="334" font-size="11.5" fill="currentColor">thermometer. Your own leaflet sets the numbers.</text>
<text x="354" y="354" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
</svg>
