<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 342" width="360" height="342" color="#1b1b1b" font-family="Helvetica, Arial, sans-serif" font-size="13" class="gpfig fig-box-fan-filter" aria-label="Box fan with a furnace filter in a clean room">
