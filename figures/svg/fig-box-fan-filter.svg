<text x="80" y="82" font-size="10" fill="currentColor">smoky room air</text><text x="190" y="82" font-size="10" fill="#1e6fc0">filtered air</text>
<text x="244" y="206" font-size="10.5" font-weight="bold" fill="#c62828">make no smoke:</text>
<line x1="244" y1="214" x2="252" y2="222" stroke="#c62828" stroke-width="2" stroke-linecap="round"/><line x1="244" y1="222" x2="252" y2="214" stroke="#c62828" stroke-width="2" stroke-linecap="round"/><text x="248" y="238" font-size="9" text-anchor="middle" fill="currentColor">candles</text>
<line x1="280" y1="214" x2="288" y2="222" stroke="#c62828" stroke-width="2" stroke-linecap="round"/><line x1="280" y1="222" x2="288" y2="214" stroke="#c62828" stroke-width="2" stroke-linecap="round"/><text x="284" y="238" font-size="9" text-anchor="middle" fill="currentColor">frying</text>
<line x1="316" y1="214" x2="324" y2="222" stroke="#c62828" stroke-width="2" stroke-linecap="round"/><line x1="316" y1="222" x2="324" y2="214" stroke="#c62828" stroke-width="2" stroke-linecap="round"/><text x="320" y="238" font-size="9" text-anchor="middle" fill="currentColor">sprays</text>
<text x="8" y="272" font-size="11.5" font-weight="bold" fill="currentColor">Better: a portable air cleaner sized for the room,</text>
<text x="8" y="287" font-size="11.5" fill="currentColor">highest setting, a type that makes no ozone.</text>
<text x="8" y="302" font-size="11.5" fill="currentColor">The box fan and filter is a temporary substitute.</text>
<text x="8" y="317" font-size="11.5" fill="currentColor">Fresh-air settings off; recirculate.</text>
<text x="354" y="336" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
