<text x="115.0" y="60" font-size="11" text-anchor="middle" font-weight="bold" fill="#d97a00">16 on the lid (two-thirds)</text>
<text x="115.0" y="218" font-size="11" text-anchor="middle" font-weight="bold" fill="#d97a00">8 underneath (one-third)</text>
<text x="4" y="244" font-size="11" fill="currentColor">Rule: briquettes = 2 × diameter</text>
<text x="4" y="258" font-size="11" fill="currentColor">(10-inch oven: 20).</text>
<text x="4" y="272" font-size="11" font-weight="bold" fill="currentColor">±2 briquettes ≈ ±25 °F</text>
<text x="4" y="286" font-size="11" fill="currentColor">(about 350 °F: 26).</text>
<text x="296" y="40" font-size="11.5" text-anchor="middle" font-weight="bold" fill="currentColor">Every 15 min</text>
<circle cx="296" cy="110" r="40" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="2"/><circle cx="296" cy="110" r="30" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 2"/>
