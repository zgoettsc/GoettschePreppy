<path d="M316,92 A26,26 0 0 0 278,90" fill="none" stroke="#c62828" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><line x1="286" y1="86" x2="281.1" y2="88.9" stroke="#c62828" stroke-width="1.8" stroke-linecap="round"/><path d="M276,92 L282.7,91.5 L279.6,86.3 Z" fill="#c62828" stroke="none"/>
<text x="296" y="180" font-size="10" text-anchor="middle" fill="currentColor">oven: ¼ turn</text>
<text x="296" y="192" font-size="10" text-anchor="middle" fill="currentColor">one way</text>
<text x="296" y="58.0" font-size="1" fill="currentColor"></text>
<text x="296" y="212" font-size="10" text-anchor="middle" fill="#c62828">lid: ¼ turn</text>
<text x="296" y="224" font-size="10" text-anchor="middle" fill="#c62828">the other way</text>
<text x="8" y="316" font-size="11.5" fill="currentColor">Cold or wind: expect more. Briquettes last about 30</text>
<text x="8" y="331" font-size="11.5" fill="currentColor">minutes. Check with a thermometer inside the pot.</text>
<text x="354" y="350" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
