<text x="130" y="400" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor">PROPANE TANK</text>
<text x="232" y="354" font-size="11.5" font-weight="bold" fill="#c62828">Propane: close</text>
<text x="232" y="368" font-size="11.5" font-weight="bold" fill="#c62828">the valve under</text>
<text x="232" y="382" font-size="11.5" font-weight="bold" fill="#c62828">the dome,</text>
<text x="232" y="396" font-size="11.5" font-weight="bold" fill="#c62828">clockwise</text>
<text x="232" y="410" font-size="11.5" fill="#c62828">(&quot;righty tighty&quot;).</text>
<text x="8" y="442" font-size="11" fill="currentColor">Do not turn gas back on yourself while the utility</text>
<text x="8" y="456" font-size="11" fill="currentColor">exists: only the utility restores service and relights pilots.</text>
<text x="354" y="470" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.75">Diagram, not to scale</text>
