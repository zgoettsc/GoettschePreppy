<text x="296" y="132" font-size="10.5" font-weight="bold" fill="currentColor">¼ turn</text>
<text x="252" y="216" font-size="10" text-anchor="end" fill="currentColor">pipe from</text><text x="252" y="228" font-size="10" text-anchor="end" fill="currentColor">the ground</text>
<text x="270" y="16" font-size="16" text-anchor="middle" font-weight="bold" fill="#c62828">OFF</text>
<text x="270" y="34" font-size="11" text-anchor="middle" font-weight="bold" fill="#c62828">bar CROSSWISE</text>
<text x="270" y="47" font-size="11" text-anchor="middle" font-weight="bold" fill="#c62828">to the pipe</text>
<line x1="180" y1="8" x2="180" y2="240" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
<text x="8" y="266" font-size="12" font-weight="bold" fill="currentColor">Natural gas: the valve on the pipe coming out of</text>
<text x="8" y="281" font-size="12" font-weight="bold" fill="currentColor">the ground, BEFORE the meter. 12-inch adjustable</text>
<text x="8" y="296" font-size="12" font-weight="bold" fill="currentColor">or gas wrench. Hang the wrench at the meter.</text>
